<script type="text/babel" data-presets="react">
const {useState,useEffect,useCallback,useMemo,useRef} = React;
const RC=window.Recharts;
const {AreaChart,Area,BarChart,Bar,LineChart,Line,PieChart,Pie,Cell,XAxis,YAxis,CartesianGrid,Tooltip,Legend,ResponsiveContainer}=RC;

/* ══════════════════════════════════════════════════════
   SmartChart  — universal chart wrapper with type switcher
   chartId   : unique string key (for persisting preference)
   data      : array of objects
   keys      : array of {key, name, color} — the data series
   nameKey   : string — the X-axis / label field (default 'name')
   height    : number (default 220)
   fmt       : value formatter function
   t         : theme
   Supported types: bar | barH | line | area | pie | donut | funnel
══════════════════════════════════════════════════════ */
const CHART_PREFS_KEY = 'ciq_chart_prefs';
function loadChartPrefs(){try{return JSON.parse(localStorage.getItem(CHART_PREFS_KEY)||'{}');}catch{return{};}}
function saveChartPref(id,type){try{const p=loadChartPrefs();p[id]=type;localStorage.setItem(CHART_PREFS_KEY,JSON.stringify(p));}catch{}}

const CHART_TYPES=[
  {id:'bar',    label:'Bar',       icon:'▬'},
  {id:'barH',   label:'Horiz.',    icon:'⬛'},
  {id:'line',   label:'Line',      icon:'📈'},
  {id:'area',   label:'Area',      icon:'⛰'},
  {id:'pie',    label:'Pie',       icon:'🥧'},
  {id:'donut',  label:'Donut',     icon:'🍩'},
  {id:'funnel', label:'Funnel',    icon:'🔻'},
];

function SmartChart({chartId, data=[], keys=[], nameKey='name', height=220, valFmt, t, defaultType='bar'}){
  const prefs = loadChartPrefs();
  const [type, setType] = useState(prefs[chartId] || defaultType);

  const changeType = (tp) => {
    setType(tp);
    saveChartPref(chartId, tp);
  };

  const tt = {background:t.card, border:`1px solid ${t.border}`, borderRadius:8, fontSize:12};
  const vf = valFmt || (v=>`AED ${fmt(v)}`);

  // Normalise: if keys is empty, auto-detect from first data row minus nameKey
  const series = keys.length ? keys : Object.keys(data[0]||{}).filter(k=>k!==nameKey).map((k,i)=>({key:k,name:k,color:COLORS[i%COLORS.length]}));

  // Funnel: sorted descending bars with width proportion
  const renderFunnel = () => {
    const sorted = [...data].sort((a,b)=>(b[series[0]?.key||'value']||0)-(a[series[0]?.key||'value']||0));
    const max = sorted[0]?.[series[0]?.key||'value']||1;
    return(
      <div style={{padding:'8px 0'}}>
        {sorted.map((row,i)=>{
          const val = row[series[0]?.key||'value']||0;
          const w = Math.max(20, pct(val,max));
          return(
            <div key={i} style={{marginBottom:8}}>
              <div style={{display:'flex',justifyContent:'space-between',fontSize:11,marginBottom:3}}>
                <span style={{color:t.text,fontWeight:500}}>{row[nameKey]}</span>
                <span style={{color:t.muted,fontFamily:"'DM Mono',monospace"}}>{vf(val)}</span>
              </div>
              <div style={{display:'flex',justifyContent:'center'}}>
                <div style={{width:`${w}%`,height:24,background:series[0]?.color||t.accent,borderRadius:4,transition:'width .4s',display:'flex',alignItems:'center',justifyContent:'center',fontSize:10,color:'#fff',fontWeight:600,minWidth:4}}>
                  {w>25?fmtP(w):''}
                </div>
              </div>
            </div>
          );
        })}
      </div>
    );
  };

  const renderPieOrDonut = (donut=false) => {
    const pieData = series.length===1
      ? data.map(d=>({name:d[nameKey],value:d[series[0].key]||0,color:COLORS[data.indexOf(d)%COLORS.length]}))
      : series.map(s=>({name:s.name,value:data.reduce((sum,d)=>sum+(d[s.key]||0),0),color:s.color}));
    return(
      <div>
        <ResponsiveContainer width="100%" height={height-40}>
          <PieChart>
            <Pie data={pieData.filter(d=>d.value>0)} cx="50%" cy="50%"
              innerRadius={donut?Math.round(height*0.18):0}
              outerRadius={Math.round(height*0.32)}
              dataKey="value" paddingAngle={donut?3:1}
              label={({name,percent})=>`${name.length>10?name.slice(0,10)+'…':name} ${(percent*100).toFixed(0)}%`}
              labelLine={true}>
              {pieData.map((d,i)=><Cell key={i} fill={d.color}/>)}
            </Pie>
            <Tooltip formatter={v=>[vf(v)]} contentStyle={tt}/>
          </PieChart>
        </ResponsiveContainer>
        <div style={{display:'flex',gap:8,flexWrap:'wrap',justifyContent:'center',marginTop:4}}>
          {pieData.filter(d=>d.value>0).map((d,i)=>(
            <div key={i} style={{display:'flex',alignItems:'center',gap:4,fontSize:11}}>
              <div style={{width:8,height:8,borderRadius:2,background:d.color,flexShrink:0}}/>
              <span style={{color:t.muted}}>{d.name}</span>
            </div>
          ))}
        </div>
      </div>
    );
  };

  const renderBar = (horizontal=false) => (
    <ResponsiveContainer width="100%" height={height}>
      <BarChart data={data} layout={horizontal?'vertical':'horizontal'}>
        <CartesianGrid strokeDasharray="3 3" stroke={t.border} horizontal={!horizontal} vertical={horizontal}/>
        {horizontal
          ? <><XAxis type="number" tick={{fontSize:9,fill:t.muted}} tickFormatter={v=>`${(v/1000).toFixed(0)}K`}/><YAxis type="category" dataKey={nameKey} tick={{fontSize:10,fill:t.muted}} width={110}/></>
          : <><XAxis dataKey={nameKey} tick={{fontSize:10,fill:t.muted}}/><YAxis tick={{fontSize:10,fill:t.muted}} tickFormatter={v=>`${(v/1000).toFixed(0)}K`}/></>
        }
        <Tooltip formatter={(v,n)=>[vf(v),n]} contentStyle={tt}/>
        {series.length>1&&<Legend wrapperStyle={{fontSize:11}}/>}
        {series.map((s,i)=>(
          <Bar key={s.key} dataKey={s.key} name={s.name} stackId={series.length>1?'a':undefined}
            fill={s.color} radius={i===series.length-1?(horizontal?[0,4,4,0]:[4,4,0,0]):[0,0,0,0]}>
            {series.length===1&&data.map((_,j)=><Cell key={j} fill={COLORS[j%COLORS.length]}/>)}
          </Bar>
        ))}
      </BarChart>
    </ResponsiveContainer>
  );

  const renderLine = () => (
    <ResponsiveContainer width="100%" height={height}>
      <LineChart data={data}>
        <CartesianGrid strokeDasharray="3 3" stroke={t.border}/>
        <XAxis dataKey={nameKey} tick={{fontSize:10,fill:t.muted}}/>
        <YAxis tick={{fontSize:10,fill:t.muted}} tickFormatter={v=>`${(v/1000).toFixed(0)}K`}/>
        <Tooltip formatter={(v,n)=>[vf(v),n]} contentStyle={tt}/>
        {series.length>1&&<Legend wrapperStyle={{fontSize:11}}/>}
        {series.map((s,i)=>(
          <Line key={s.key} type="monotone" dataKey={s.key} name={s.name} stroke={s.color} strokeWidth={2} dot={false}/>
        ))}
      </LineChart>
    </ResponsiveContainer>
  );

  const renderArea = () => (
    <ResponsiveContainer width="100%" height={height}>
      <AreaChart data={data}>
        <defs>
          {series.map((s,i)=>(
            <linearGradient key={s.key} id={`sc_${chartId}_${i}`} x1="0" y1="0" x2="0" y2="1">
              <stop offset="5%" stopColor={s.color} stopOpacity={0.3}/>
              <stop offset="95%" stopColor={s.color} stopOpacity={0}/>
            </linearGradient>
          ))}
        </defs>
        <CartesianGrid strokeDasharray="3 3" stroke={t.border}/>
        <XAxis dataKey={nameKey} tick={{fontSize:10,fill:t.muted}}/>
        <YAxis tick={{fontSize:10,fill:t.muted}} tickFormatter={v=>`${(v/1000).toFixed(0)}K`}/>
        <Tooltip formatter={(v,n)=>[vf(v),n]} contentStyle={tt}/>
        {series.length>1&&<Legend wrapperStyle={{fontSize:11}}/>}
        {series.map((s,i)=>(
          <Area key={s.key} type="monotone" dataKey={s.key} name={s.name}
            stroke={s.color} fill={`url(#sc_${chartId}_${i})`} strokeWidth={2}/>
        ))}
      </AreaChart>
    </ResponsiveContainer>
  );

  return(
    <div>
      {/* Type picker */}
      <div style={{display:'flex',gap:4,marginBottom:10,flexWrap:'wrap'}}>
        {CHART_TYPES.map(ct=>(
          <button key={ct.id} onClick={()=>changeType(ct.id)}
            title={ct.label}
            style={{background:type===ct.id?t.accent:t.surface,color:type===ct.id?'#fff':t.muted,
              border:`1px solid ${type===ct.id?t.accent:t.border}`,borderRadius:6,
              padding:'3px 8px',fontSize:11,cursor:'pointer',fontFamily:"'DM Sans',sans-serif",
              display:'flex',alignItems:'center',gap:4,transition:'all .15s'}}>
            <span>{ct.icon}</span><span>{ct.label}</span>
          </button>
        ))}
      </div>
      {/* Chart */}
      {type==='bar'    && renderBar(false)}
      {type==='barH'   && renderBar(true)}
      {type==='line'   && renderLine()}
      {type==='area'   && renderArea()}
      {type==='pie'    && renderPieOrDonut(false)}
      {type==='donut'  && renderPieOrDonut(true)}
      {type==='funnel' && renderFunnel()}
    </div>
  );
}

/* ── SmartCard: Card with SmartChart inside ── */
function ChartCard({title, chartId, data, keys, nameKey='name', height=220, defaultType='bar', valFmt, t, style={}}){
  return(
    <Card title={title} t={t} style={style}>
      <SmartChart chartId={chartId} data={data} keys={keys} nameKey={nameKey}
        height={height} defaultType={defaultType} valFmt={valFmt} t={t}/>
    </Card>
  );
}

/* ── IndexedDB ── */
function openDB(){return new Promise((res,rej)=>{const r=indexedDB.open('collectiq_v2',1);r.onupgradeneeded=e=>e.target.result.createObjectStore('kv');r.onsuccess=e=>res(e.target.result);r.onerror=rej;});}
async function dbSet(k,v){const db=await openDB();return new Promise((res,rej)=>{const tx=db.transaction('kv','readwrite');tx.objectStore('kv').put(v,k);tx.oncomplete=res;tx.onerror=rej;});}
async function dbGet(k){const db=await openDB();return new Promise((res,rej)=>{const r=db.transaction('kv','readonly').objectStore('kv').get(k);r.onsuccess=e=>res(e.target.result);r.onerror=rej;});}
async function dbDel(k){const db=await openDB();return new Promise((res,rej)=>{const tx=db.transaction('kv','readwrite');tx.objectStore('kv').delete(k);tx.oncomplete=res;tx.onerror=rej;});}

/* ── Simple hash for password ── */
async function hashPwd(pwd){const buf=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(pwd));return Array.from(new Uint8Array(buf)).map(b=>b.toString(16).padStart(2,'0')).join('');}

/* ── CSV ── */
function parseCSV(text){if(!text||!text.trim())return[];const lines=text.trim().split(/\r?\n/);if(lines.length<2)return[];const headers=parseCSVLine(lines[0]).map(h=>h.trim());return lines.slice(1).map(l=>{const vals=parseCSVLine(l);const obj={};headers.forEach((h,i)=>{obj[h]=(vals[i]||'').trim();});return obj;}).filter(r=>Object.values(r).some(v=>v!==''));}
function parseCSVLine(line){const res=[];let cur='',inQ=false;for(let i=0;i<line.length;i++){const c=line[i];if(c==='"'){inQ=!inQ;continue;}if(c===','&&!inQ){res.push(cur);cur='';continue;}cur+=c;}res.push(cur);return res;}
function parseAmt(v){if(!v||v==='-'||v==='')return 0;const n=parseFloat(v.replace(/[",\s$]/g,''));return isNaN(n)?0:n;}
function parseYear(yy){if(!yy)return null;const m=yy.match(/(\d{4})/);return m?parseInt(m[1]):null;}
function fmt(n,d=0){if(n===null||n===undefined||isNaN(n))return'0';return Number(n).toLocaleString('en-US',{minimumFractionDigits:d,maximumFractionDigits:d});}
function pct(a,b){return b?(a/b)*100:0;}
function fmtP(n,d=1){return fmt(n,d)+'%';}

/* ── Sheet 4 Helpers ──
   Sheet 4 now has: Name, Role, Team, Branch, Region, "Reporting to"
   Same person can appear in multiple rows (multiple branches).
   We build a rich org structure from it dynamically.
── */
function buildOrg(s4){
  // Filter out empty rows (no Name AND no Branch with actual content)
  const valid = s4.filter(r => r.Name && r.Name.trim());
  // Deduplicate people: key = Name (person), collect all branches/teams/regions
  const people = {};
  valid.forEach(r => {
    const name = r.Name.trim();
    if(!people[name]) people[name] = {name, role:r.Role||'', teams:[], branches:[], regions:[], reportingTo:r['Reporting to']||r.ReportingTo||''};
    if(r.Team && !people[name].teams.includes(r.Team)) people[name].teams.push(r.Team);
    if(r.Branch && !people[name].branches.includes(r.Branch)) people[name].branches.push(r.Branch);
    if(r.Region && !people[name].regions.includes(r.Region)) people[name].regions.push(r.Region);
  });
  return {valid, people, list: Object.values(people)};
}
function isManager(role){
  const r=(role||'').toLowerCase().trim();
  return r.includes('manager')||r==='higher manager'||r==='regional manager'||r==='team manager'||r.includes('head');
}
function isExecutive(role){
  const r=(role||'').toLowerCase().trim();
  return r!==''&&!isManager(role)&&!r.includes('ceo')&&!r.includes('director');
}
// Commission role category
function commRole(role){
  const r=(role||'').toLowerCase().trim();
  if(r.includes('support head')) return 'support_head';
  if(r.includes('support incharge')||r.includes('support in-charge')) return 'support_incharge';
  if(r==='regional manager'||r.includes('regional sales head')||r.includes('rsm')) return 'regional_head';
  if(r==='team manager'||r==='higher manager'||r.includes('sales manager')||r.includes('manager')) return 'sales_manager';
  if(r.includes('sales consultant')||r.includes('consultant')) return 'sales_consultant';
  if(r.includes('executive')) return 'executive';
  return 'unknown';
}
function getPersonInfo(s4, name){
  // Returns merged info for a person across all their rows
  const rows = s4.filter(r=>r.Name&&r.Name.trim()===name.trim());
  if(!rows.length) return {};
  return {
    Name: name,
    Role: rows[0].Role||'',
    Team: rows.map(r=>r.Team).filter(Boolean).join(', '),
    Branch: rows.map(r=>r.Branch).filter(Boolean).join(', '),
    Region: rows.map(r=>r.Region).filter(Boolean).join(', '),
    ReportingTo: rows[0]['Reporting to']||rows[0].ReportingTo||'',
    rows
  };
}

/* ── Shared UI ── */
function KPI({label,value,sub,t,ac}){return(<div style={{background:t.card,border:`1px solid ${t.border}`,borderRadius:12,padding:'16px 20px'}}><div style={{fontSize:11,fontWeight:700,color:t.muted,textTransform:'uppercase',letterSpacing:'.6px',marginBottom:8}}>{label}</div><div style={{fontSize:22,fontWeight:700,color:ac||t.text,fontFamily:"'DM Mono',monospace"}}>{value}</div>{sub&&<div style={{fontSize:12,color:t.muted,marginTop:4}}>{sub}</div>}</div>);}
function Card({children,title,t,style={},action}){return(<div style={{background:t.card,border:`1px solid ${t.border}`,borderRadius:12,padding:'18px 20px',...style}}>{title&&<div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:14}}><div style={{fontSize:11,fontWeight:700,color:t.muted,textTransform:'uppercase',letterSpacing:'.7px'}}>{title}</div>{action}</div>}{children}</div>);}
function Badge({text,type='blue'}){const m={blue:{bg:'#dbeafe',c:'#1e40af'},green:{bg:'#d1fae5',c:'#065f46'},amber:{bg:'#fef3c7',c:'#92400e'},red:{bg:'#fee2e2',c:'#991b1b'},purple:{bg:'#ede9fe',c:'#5b21b6'},gray:{bg:'#f1f5f9',c:'#475569'}};const col=m[type]||m.blue;return <span style={{display:'inline-block',fontSize:11,padding:'2px 9px',borderRadius:20,fontWeight:600,background:col.bg,color:col.c,whiteSpace:'nowrap'}}>{text}</span>;}
function MiniBar({value,max,color='#3b82f6',t}){return(<div style={{background:t.surface,borderRadius:4,height:5,flex:1}}><div style={{height:5,borderRadius:4,background:color,width:`${Math.min(100,pct(value,max||1))}%`,transition:'width .3s'}}/></div>);}
function Chip({label,active,onClick,t}){return(<span onClick={onClick} style={{display:'inline-block',fontSize:11,padding:'3px 9px',borderRadius:6,margin:2,cursor:'pointer',border:`1px solid ${active?t.accent:t.border}`,background:active?t.accent:t.surface,color:active?'#fff':t.muted,transition:'all .15s'}}>{label}</span>);}
function FG({label,children,t}){const[o,sO]=useState(true);return(<div style={{background:t.card,border:`1px solid ${t.border}`,borderRadius:10,padding:'12px 14px',marginBottom:10}}><div onClick={()=>sO(x=>!x)} style={{display:'flex',justifyContent:'space-between',cursor:'pointer',fontSize:11,fontWeight:700,color:t.muted,textTransform:'uppercase',letterSpacing:'.6px',marginBottom:o?8:0}}>{label}<span>{o?'▾':'▸'}</span></div>{o&&<div>{children}</div>}</div>);}
function Btn({children,onClick,primary,t,disabled,style={}}){return(<button onClick={onClick} disabled={disabled} style={{background:primary?t.accent:t.surface,color:primary?'#fff':t.text,border:`1px solid ${primary?t.accent:t.border}`,borderRadius:8,padding:'7px 14px',fontSize:13,fontWeight:600,cursor:disabled?'not-allowed':'pointer',opacity:disabled?.5:1,fontFamily:"'DM Sans',sans-serif",...style}}>{children}</button>);}
function TH({children,t,right}){return <th style={{textAlign:right?'right':'left',padding:'8px 10px',borderBottom:`1px solid ${t.border}`,fontSize:11,fontWeight:700,color:t.muted,textTransform:'uppercase',letterSpacing:'.5px',whiteSpace:'nowrap'}}>{children}</th>;}
function TD({children,t,mono,color,right,bold,style={}}){return <td style={{padding:'7px 10px',borderBottom:`1px solid ${t.border}`,fontFamily:mono?"'DM Mono',monospace":undefined,fontSize:mono?12:13,color:color||t.text,textAlign:right?'right':'left',fontWeight:bold?700:400,...style}}>{children}</td>;}
function Inp({value,onChange,placeholder,t,style={},type='text'}){return <input type={type} value={value} onChange={onChange} placeholder={placeholder} style={{background:t.surface,border:`1px solid ${t.border}`,borderRadius:8,padding:'8px 12px',fontSize:13,color:t.text,fontFamily:"'DM Sans',sans-serif",width:'100%',...style}}/>;}
function Sel({value,onChange,options,t,style={}}){return <select value={value} onChange={onChange} style={{background:t.surface,border:`1px solid ${t.border}`,borderRadius:8,padding:'7px 10px',fontSize:13,color:t.text,fontFamily:"'DM Sans',sans-serif",...style}}>{options.map(([v,l])=><option key={v} value={v}>{l||v}</option>)}</select>;}

/* ── AI Insights (calls Anthropic API) ── */
function AIInsights({prompt,t,label='AI Insights'}){
  const[text,setText]=useState('');const[loading,setLoading]=useState(false);const[done,setDone]=useState(false);
  const run=async()=>{
    setLoading(true);setText('');setDone(false);
    // Use Pollinations.ai text API — free, no API key needed, works from browser
    try{
      const encoded=encodeURIComponent(prompt);
      const res=await fetch(`https://text.pollinations.ai/${encoded}`,{method:'GET'});
      if(!res.ok) throw new Error(`HTTP ${res.status}`);
      const txt=await res.text();
      setText(txt.trim());setDone(true);
    }catch(e){
      // Fallback: try openrouter free tier
      try{
        const res2=await fetch('https://openrouter.ai/api/v1/chat/completions',{
          method:'POST',
          headers:{'Content-Type':'application/json','HTTP-Referer':'https://collectiq.local','X-Title':'CollectIQ'},
          body:JSON.stringify({model:'mistralai/mistral-7b-instruct:free',messages:[{role:'user',content:prompt}]})
        });
        const d=await res2.json();
        const txt2=d.choices?.[0]?.message?.content||'No response received';
        setText(txt2.trim());setDone(true);

/* ── Password Gate ── */
function PasswordGate({t,onUnlock}){
  const[pwd,setPwd]=useState('');const[err,setErr]=useState('');
  const check=async()=>{
    const h=await hashPwd(pwd);
    const stored=await dbGet('pwd_hash');
    if(!stored){await dbSet('pwd_hash',h);onUnlock();}
    else if(h===stored){onUnlock();}
    else{setErr('Incorrect password');setPwd('');}
  };
  return(<div style={{minHeight:'100vh',background:t.bg,display:'flex',alignItems:'center',justifyContent:'center'}}>
    <div style={{background:t.card,border:`1px solid ${t.border}`,borderRadius:16,padding:40,width:360,textAlign:'center'}}>
      <div style={{fontSize:40,marginBottom:16}}>🔐</div>
      <div style={{fontSize:20,fontWeight:700,color:t.text,marginBottom:8}}>CollectIQ</div>
      <div style={{fontSize:13,color:t.muted,marginBottom:24}}>Enter your password to continue</div>
      <Inp value={pwd} onChange={e=>{setPwd(e.target.value);setErr('');}} placeholder="Password" t={t} type="password" style={{marginBottom:12,textAlign:'center'}}/>
      {err&&<div style={{fontSize:12,color:t.danger,marginBottom:10}}>{err}</div>}
      <Btn primary t={t} onClick={check} style={{width:'100%',padding:'10px',fontSize:14}}>Unlock</Btn>
      <div style={{fontSize:11,color:t.muted,marginTop:16}}>First time? Any password you enter becomes the master password.</div>
    </div>
  </div>);
}

/* ── Security Tab ── */
function SecurityTab({t,onLock,credit,onSaveCredit}){
  const[cur,setCur]=useState('');const[np,setNp]=useState('');const[np2,setNp2]=useState('');const[msg,setMsg]=useState('');const[msgType,setMsgType]=useState('');
  const m=(txt,tp)=>{setMsg(txt);setMsgType(tp);setTimeout(()=>setMsg(''),3000);};
  const change=async()=>{
    if(!cur||!np||!np2){m('Fill all fields','danger');return;}
    if(np!==np2){m('New passwords do not match','danger');return;}
    if(np.length<4){m('Password too short (min 4 chars)','danger');return;}
    const curH=await hashPwd(cur);const stored=await dbGet('pwd_hash');
    if(stored&&curH!==stored){m('Current password incorrect','danger');return;}
    await dbSet('pwd_hash',await hashPwd(np));
    m('Password updated ✓','success');setCur('');setNp('');setNp2('');
  };
  const remove=async()=>{
    if(!cur){m('Enter current password first','danger');return;}
    const curH=await hashPwd(cur);const stored=await dbGet('pwd_hash');
    if(stored&&curH!==stored){m('Current password incorrect','danger');return;}
    await dbDel('pwd_hash');
    m('Password removed — dashboard is now open','success');setCur('');
  };
  return(<div style={{maxWidth:460}}>

        <div key={lbl} style={{marginBottom:12}}>
          <label style={{fontSize:12,fontWeight:600,color:t.muted,display:'block',marginBottom:5}}>{lbl}</label>

        <Btn primary t={t} onClick={change}>Update Password</Btn>

/* ── Commission Tab ── */
// Default stream lists
const DEFAULT_NS_STREAMS=['Existing business - New License - SaaS In Premise','New business - In Premise','New Business - In Premise','New Business - SaaS In Premise','Services'];
const DEFAULT_RN_STREAMS=['AMC','Existing Business - New -SaaS Annually','Existing business - upgrade-SaaS annually','New Business-SaaS Annually','New Business-SaaS 2 Years In Cloud'];

function CommissionTab({sheets,targets,t,dark}){
  const[sel,setSel]=useState('');const[year,setYear]=useState(new Date().getFullYear());const[qtr,setQtr]=useState('Q1');
  const[nsAmt,setNsAmt]=useState('');const[rnAmt,setRnAmt]=useState('');
  const[nsOverride,setNsOverride]=useState(false);const[rnOverride,setRnOverride]=useState(false);
  const[nsStreams,setNsStreams]=useState(DEFAULT_NS_STREAMS);
  const[rnStreams,setRnStreams]=useState(DEFAULT_RN_STREAMS);
  const[showStreamEdit,setShowStreamEdit]=useState(false);
  const curYear=new Date().getFullYear();

  const execList=useMemo(()=>{const org2=buildOrg(sheets.s4);return org2.list.map(p=>p.name).sort();},[sheets.s4]);
  const info=useMemo(()=>getPersonInfo(sheets.s4,sel),[sel,sheets.s4]);
  const role=useMemo(()=>(info.Role||'').trim(),[info]);
  const salary=useMemo(()=>parseFloat(targets[`salary_${sel}`]||0),[targets,sel]);

  // Auto-calculate from transaction sheets
  const autoCalc=useMemo(()=>{
    if(!sel) return {ns:0,rn:0};
    const qMos=Q_MONTHS[qtr]||[];
    const qIdx=['Q1','Q2','Q3','Q4'].indexOf(qtr);
    const ytdMos=[].concat(...['Q1','Q2','Q3','Q4'].slice(0,qIdx+1).map(q=>Q_MONTHS[q]));
    // Use sheet1 for historical years, sheet2 for current year
    const srcSheet=year===curYear?sheets.s2:[...sheets.s1,...sheets.s2];
    const rows=srcSheet.filter(r=>{
      const ry=parseYear(r.yy);
      return ry===year && (r.Employee?.trim()===sel||r.Executive?.trim()===sel);
    });
    const nsTotal=rows.filter(r=>qMos.includes(r.Month)&&nsStreams.some(s=>s.toLowerCase()===((r.Stream||r.stream||'').toLowerCase()))).reduce((sum,r)=>sum+parseAmt(r.Collection||r.Amount||0),0);
    const rnTotal=rows.filter(r=>ytdMos.includes(r.Month)&&rnStreams.some(s=>s.toLowerCase()===((r.Stream||r.stream||'').toLowerCase()))).reduce((sum,r)=>sum+parseAmt(r.Collection||r.Amount||0),0);
    return{ns:nsTotal,rn:rnTotal};
  },[sel,year,qtr,sheets.s1,sheets.s2,nsStreams,rnStreams,curYear]);

  // Use override if user typed manually, else use auto
  const ns=nsOverride?parseFloat(nsAmt)||0:autoCalc.ns;
  const rn=rnOverride?parseFloat(rnAmt)||0:autoCalc.rn;

  // Sync displayed values when auto changes
  useEffect(()=>{if(!nsOverride)setNsAmt(autoCalc.ns>0?String(autoCalc.ns):'');},[autoCalc.ns,nsOverride]);
  useEffect(()=>{if(!rnOverride)setRnAmt(autoCalc.rn>0?String(autoCalc.rn):'');},[autoCalc.rn,rnOverride]);
  useEffect(()=>{setNsOverride(false);setRnOverride(false);},[sel,year,qtr]);

  const annTarget=parseFloat(targets[`target_${sel}_${year}`]||0);
  const qTarget=annTarget*(Q_WEIGHTS[qtr]||0.25);
  const renewTarget=parseFloat(targets[`renewals_${sel}_${year}`]||0);
  const qPct=qTarget?pct(ns,qTarget):0;
  const rnPct=renewTarget?pct(rn,renewTarget):0;
  const ytdPct=annTarget?pct(ns,annTarget):0;
  const ii={background:t.surface,border:`1px solid ${t.border}`,borderRadius:8,padding:'8px 12px',fontSize:13,color:t.text,fontFamily:"'DM Sans',sans-serif",width:'100%'};

  const result=useMemo(()=>{
    if(!sel)return null;
    let nc=0,rc=0,nb='Role not configured',rb='Role not configured',gate=true;
    const r=role.toLowerCase();
    if(r.includes('support head')){
      if(qPct>=100){nc=ns*0.025;nb='100%+ → 2.50%';}else if(qPct>=80){nc=ns*0.02;nb='80–99.99% → 2.00%';}else if(qPct>=70){nc=ns*0.015;nb='70–79.99% → 1.50%';}else{nc=0;nb='Below 70% → 0%';}
      if(rnPct>=100){rc=rn*0.02;rb='100%+ → 2.00%';}else if(rnPct>=90){rc=rn*0.015;rb='90–99.99% → 1.50%';}else if(rnPct>=80){rc=rn*0.01;rb='80–89.99% → 1.00%';}else{rc=0;rb='Below 80% → 0%';}
    } else if(r.includes('support incharge')||r.includes('support in-charge')){
      if(qPct>=100){nc=ns*0.05;nb='100%+ → 5.00%';}else if(qPct>=80){nc=ns*0.04;nb='80–99.99% → 4.00%';}else if(qPct>=70){nc=ns*0.03;nb='70–79.99% → 3.00%';}else{nc=ns*0.01;nb='0–69.99% → 1.00% (from first dirham)';}
      if(rnPct>=100){rc=rn*0.03;rb='100%+ → 3.00%';}else if(rnPct>=80){rc=rn*0.0275;rb='80–99.99% → 2.75%';}else if(rnPct>=70){rc=rn*0.025;rb='70–79.99% → 2.50%';}else{rc=0;rb='Below 70% → 0%';}
    } else if(r.includes('regional sales head')||r.includes('rsm')){
      gate=qPct>=70;
      if(qPct>=100){nc=ns*0.0125;nb='100%+ → 1.25%';}else if(qPct>=85){nc=ns*0.009;nb='85–99.99% → 0.90%';}else if(qPct>=60){nc=ns*0.0055;nb='60–84.99% → 0.55%';}else{nc=0;nb='Below 60% → 0%';}
      if(gate){if(rnPct>=100){rc=rn*0.01;rb='100%+ → 1.00%';}else if(rnPct>=85){rc=rn*0.0075;rb='85–99.99% → 0.75%';}else if(rnPct>=75){rc=rn*0.005;rb='75–84.99% → 0.50%';}else{rc=0;rb='Below 75% → 0%';}}else rb='🔒 Gate locked (need 70% new sales first)';
    } else if(r.includes('sales manager')||r.includes('manager')){
      gate=qPct>=70;
      if(qPct>=100){nc=ns*0.015;nb='100%+ → 1.50%';}else if(qPct>=85){nc=ns*0.0115;nb='85–99.99% → 1.15%';}else if(qPct>=60){nc=ns*0.008;nb='60–84.99% → 0.80%';}else{nc=0;nb='Below 60% → 0%';}
      if(gate){if(rnPct>=100){rc=rn*0.0125;rb='100%+ → 1.25%';}else if(rnPct>=85){rc=rn*0.01;rb='85–99.99% → 1.00%';}else if(rnPct>=75){rc=rn*0.0075;rb='75–84.99% → 0.75%';}else{rc=0;rb='Below 75% → 0%';}}else rb='🔒 Gate locked (need 70% new sales first)';
    } else if(r.includes('sales consultant')||r.includes('consultant')){
      if(qPct>=100){nc=qTarget*0.06+(ns-qTarget)*0.10;nb=`6% on first AED ${fmt(qTarget)} + 10% on AED ${fmt(ns-qTarget)} excess`;}else if(qPct>=75){nc=ns*0.06;nb='75–99.99% → 6.00%';}else if(qPct>=60){nc=ns*0.04;nb='60–74.99% → 4.00%';}else{nc=ns*0.02;nb='0–59.99% → 2.00%';}
      rc=0;rb='No renewals commission for Sales Consultant';
    } else {
      nb=`Role "${role}" not matched — check Sheet 4 spelling`;rb='N/A';
    }
    const qSal=salary*3;const halfAnn=salary*6;
    let bonus=0,bonusNote='';
    if(ytdPct>=100){bonus=halfAnn;bonusNote=`Slab 2 (≥100% YTD): 6 × salary = AED ${fmt(halfAnn)}`;}
    else if(ytdPct>=90){bonus=qSal;bonusNote=`Slab 1 (≥90% YTD): 3 × salary = AED ${fmt(qSal)}`;}
    else bonusNote='Below 90% YTD — no annual bonus';
    const slabs=[60,70,75,80,85,100];const nextSlab=slabs.find(s=>s>qPct);
    const whatif=nextSlab?`Need AED ${fmt(Math.max(0,(qTarget*nextSlab/100)-ns))} more to reach ${nextSlab}% (next commission slab)`:'Already at 100%+ — great work!';
    return{nc,rc,nb,rb,gate,bonus,bonusNote,total:nc+rc+bonus,whatif,qPct,rnPct,ytdPct};
  },[sel,role,ns,rn,qPct,rnPct,ytdPct,qTarget,salary]);

  function CRow({label,amount,note,warn}){return(<div style={{display:'flex',justifyContent:'space-between',alignItems:'flex-start',padding:'10px 0',borderBottom:`1px solid ${t.border}`}}><div><div style={{fontSize:13,fontWeight:500,color:t.text}}>{label}</div><div style={{fontSize:11,color:warn?t.danger:t.muted,marginTop:3}}>{note}</div></div><div style={{fontSize:16,fontWeight:700,fontFamily:"'DM Mono',monospace",color:amount>0?t.success:t.muted}}>AED {fmt(amount)}</div></div>);}

  const debugMsg=sel&&!role?'⚠️ Employee found but Role is empty in Sheet 4 — please fill in their Role':
    sel&&role&&!['support head','support incharge','support in-charge','regional sales head','rsm','sales manager','manager','sales consultant','consultant'].some(r=>role.toLowerCase().includes(r))?`⚠️ Role "${role}" is not recognised. Known roles: Support Head, Support Incharge, Regional Sales Head, Sales Manager, Sales Consultant`:'';

  return(<div style={{maxWidth:820}}>
    <Card title="Commission Calculator" t={t}>
      {/* Selector row */}
      <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:16,marginBottom:16}}>
        <div><label style={{fontSize:12,fontWeight:600,color:t.muted,display:'block',marginBottom:6}}>Executive</label>
          <select value={sel} onChange={e=>setSel(e.target.value)} style={ii}><option value="">Select executive...</option>{execList.map(n=><option key={n} value={n}>{n}</option>)}</select>
        </div>
        <div style={{display:'flex',gap:8}}>
          <div style={{flex:1}}><label style={{fontSize:12,fontWeight:600,color:t.muted,display:'block',marginBottom:6}}>Year</label><select value={year} onChange={e=>setYear(parseInt(e.target.value))} style={ii}>{[2022,2023,2024,2025,2026].map(y=><option key={y} value={y}>{y}</option>)}</select></div>
          <div style={{flex:1}}><label style={{fontSize:12,fontWeight:600,color:t.muted,display:'block',marginBottom:6}}>Quarter</label><select value={qtr} onChange={e=>setQtr(e.target.value)} style={ii}>{['Q1','Q2','Q3','Q4'].map(q=><option key={q}>{q}</option>)}</select></div>
        </div>
      </div>

      {/* Info bar */}
      {sel&&<div style={{background:t.surface,borderRadius:8,padding:'10px 14px',marginBottom:12,fontSize:13,display:'flex',gap:16,flexWrap:'wrap'}}>
        <span><strong>{sel}</strong></span>

        <span style={{color:t.muted}}>Branch: {info.Branch||'—'}</span>
        <span style={{color:t.muted}}>Team: {info.Team||'—'}</span>
        <span style={{color:t.muted}}>Salary: AED {fmt(salary)}/mo</span>
      </div>}
      {debugMsg&&<div style={{background:'#fef3c7',border:'1px solid #fcd34d',borderRadius:8,padding:'10px 14px',marginBottom:12,fontSize:12,color:'#92400e'}}>{debugMsg}</div>}

      {/* Stream editor toggle */}
      <div style={{marginBottom:12}}>
        <Btn t={t} onClick={()=>setShowStreamEdit(s=>!s)} style={{fontSize:11,padding:'4px 10px'}}>

        </Btn>
      </div>
      {showStreamEdit&&(

          <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:16}}>
            <div>
              <div style={{fontSize:12,fontWeight:700,color:t.muted,marginBottom:8}}>NEW SALES STREAMS (one per line)</div>
              <textarea value={nsStreams.join('\n')} onChange={e=>setNsStreams(e.target.value.split('\n').map(s=>s.trim()).filter(Boolean))}

          </div>

          {nsOverride&&<Btn t={t} onClick={()=>{setNsOverride(false);}} style={{fontSize:10,padding:'2px 7px',marginTop:4}}>↩ Reset to Auto</Btn>}
          {qTarget>0&&<div style={{fontSize:11,color:t.muted,marginTop:4}}>{qtr} target: AED {fmt(qTarget)} → <strong style={{color:qPct>=100?t.success:qPct>=75?t.warning:t.danger}}>{fmtP(qPct)}</strong></div>}
          {!qTarget&&sel&&<div style={{fontSize:11,color:t.warning,marginTop:4}}>⚠️ No {year} target set — go to Targets tab</div>}
          {sel&&autoCalc.ns===0&&!nsOverride&&<div style={{fontSize:11,color:t.muted,marginTop:4}}>No matching transactions found for selected streams</div>}
        </div>
        <div>
          <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:6}}>
            <label style={{fontSize:12,fontWeight:600,color:t.muted}}>Renewals Collected YTD (AED)</label>
            <span style={{fontSize:10,background:rnOverride?t.warning+'33':t.success+'33',color:rnOverride?t.warning:t.success,borderRadius:4,padding:'1px 6px',fontWeight:600}}>{rnOverride?'Manual':'Auto'}</span>
          </div>
          <input type="number" value={rnAmt} onChange={e=>{setRnAmt(e.target.value);setRnOverride(true);}} placeholder="0" style={ii}/>
          {rnOverride&&<Btn t={t} onClick={()=>{setRnOverride(false);}} style={{fontSize:10,padding:'2px 7px',marginTop:4}}>↩ Reset to Auto</Btn>}
          {renewTarget>0&&<div style={{fontSize:11,color:t.muted,marginTop:4}}>Renewals target: AED {fmt(renewTarget)} → <strong style={{color:rnPct>=100?t.success:rnPct>=75?t.warning:t.danger}}>{fmtP(rnPct)}</strong></div>}
          {!renewTarget&&sel&&<div style={{fontSize:11,color:t.muted,marginTop:4}}>No renewals target set</div>}

      {/* Progress bars */}
      {result&&<div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:12,marginBottom:16}}>
        {[['New Sales QTD',result.qPct,t.accent],['Renewals YTD',result.rnPct,'#10b981'],['YTD Annual',result.ytdPct,'#8b5cf6']].map(([lbl,val,col])=>(
          <div key={lbl} style={{background:t.surface,borderRadius:8,padding:'10px 14px'}}>
            <div style={{display:'flex',justifyContent:'space-between',marginBottom:6,fontSize:12}}><span style={{color:t.muted}}>{lbl}</span><strong style={{color:val>=100?t.success:val>=75?t.warning:t.danger}}>{fmtP(val)}</strong></div>
            <div style={{background:t.border,borderRadius:4,height:6}}><div style={{height:6,borderRadius:4,background:col,width:`${Math.min(100,val)}%`,transition:'width .3s'}}/></div>
          </div>
        ))}
      </div>}

      {/* Results */}
      {result?(<div>
        <div style={{borderTop:`1px solid ${t.border}`,paddingTop:14}}>
          <CRow label="New Sales Commission" amount={result.nc} note={result.nb}/>
          <CRow label="Renewals Commission" amount={result.rc} note={result.rb} warn={!result.gate}/>
          <CRow label="Annual Performance Bonus" amount={result.bonus} note={result.bonusNote}/>
