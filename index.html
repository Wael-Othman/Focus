<script type="text/babel" data-presets="react,env">
const {useState,useEffect,useCallback,useMemo,useRef} = React;
const RC=window.Recharts;
const {AreaChart,Area,BarChart,Bar,LineChart,Line,PieChart,Pie,Cell,XAxis,YAxis,CartesianGrid,Tooltip,Legend,ResponsiveContainer}=RC;

/* ══════════════════════════════════════════════════════
   SmartChart  — universal chart wrapper with type switcher
   chartId   : unique string key (for persisting preference)
   data      : array of objects
   keys      : array of {key, name, color} — the data series
   nameKey   : string — the X-axis / label field (default 'name')
   height    : number (default 220)
   fmt       : value formatter function
   t         : theme
   Supported types: bar | barH | line | area | pie | donut | funnel
══════════════════════════════════════════════════════ */
const CHART_PREFS_KEY = 'ciq_chart_prefs';
function loadChartPrefs(){try{return JSON.parse(localStorage.getItem(CHART_PREFS_KEY)||'{}');}catch(_e){return{};}}
function saveChartPref(id,type){try{const p=loadChartPrefs();p[id]=type;localStorage.setItem(CHART_PREFS_KEY,JSON.stringify(p));}catch(_e){}}

const CHART_TYPES=[
  {id:'bar',    label:'Bar',       icon:'▬'},
  {id:'barH',   label:'Horiz.',    icon:'⬛'},
  {id:'line',   label:'Line',      icon:'📈'},
  {id:'area',   label:'Area',      icon:'⛰'},
  {id:'pie',    label:'Pie',       icon:'🥧'},
  {id:'donut',  label:'Donut',     icon:'🍩'},
  {id:'funnel', label:'Funnel',    icon:'🔻'},
];

function SmartChart({chartId, data=[], keys=[], nameKey='name', height=220, valFmt, t, defaultType='bar'}){
  const prefs = loadChartPrefs();
  const [type, setType] = useState(prefs[chartId] || defaultType);

  const changeType = (tp) => {
    setType(tp);
    saveChartPref(chartId, tp);
  };

  const tt = {background:t.card, border:`1px solid ${t.border}`, borderRadius:8, fontSize:12};
  const vf = valFmt || (v=>`AED ${fmt(v)}`);

  // Normalise: if keys is empty, auto-detect from first data row minus nameKey
  const series = keys.length ? keys : Object.keys(data[0]||{}).filter(k=>k!==nameKey).map((k,i)=>({key:k,name:k,color:COLORS[i%COLORS.length]}));

  // Funnel: sorted descending bars with width proportion
  const renderFunnel = () => {
    const _sk=series[0]&&series[0].key?series[0].key:'value';const sorted=[...data].sort((a,b)=>(b[_sk]||0)-(a[_sk]||0));
    const max=(sorted[0]&&sorted[0][_sk])||1;
    return(
      <div style={{padding:'8px 0'}}>
        {sorted.map((row,i)=>{
          const val=row[_sk]||0;
          const w = Math.max(20, pct(val,max));
          return(
            <div key={i} style={{marginBottom:8}}>
              <div style={{display:'flex',justifyContent:'space-between',fontSize:11,marginBottom:3}}>
                <span style={{color:t.text,fontWeight:500}}>{row[nameKey]}</span>
                <span style={{color:t.muted,fontFamily:"'DM Mono',monospace"}}>{vf(val)}</span>
              </div>
              <div style={{display:'flex',justifyContent:'center'}}>
                <div style={{width:`${w}%`,height:24,background:(series[0]&&series[0].color)||t.accent,borderRadius:4,transition:'width .4s',display:'flex',alignItems:'center',justifyContent:'center',fontSize:10,color:'#fff',fontWeight:600,minWidth:4}}>
                  {w>25?fmtP(w):''}
                </div>
              </div>
            </div>
          );
        })}
      </div>
    );
  };

  const renderPieOrDonut = (donut=false) => {
    const pieData = series.length===1
      ? data.map(d=>({name:d[nameKey],value:d[series[0].key]||0,color:COLORS[data.indexOf(d)%COLORS.length]}))
      : series.map(s=>({name:s.name,value:data.reduce((sum,d)=>sum+(d[s.key]||0),0),color:s.color}));
    return(
      <div>
        <ResponsiveContainer width="100%" height={height-40}>
          <PieChart>
            <Pie data={pieData.filter(d=>d.value>0)} cx="50%" cy="50%"
              innerRadius={donut?Math.round(height*0.18):0}
              outerRadius={Math.round(height*0.32)}
              dataKey="value" paddingAngle={donut?3:1}
              label={({name,percent})=>`${name.length>10?name.slice(0,10)+'…':name} ${(percent*100).toFixed(0)}%`}
              labelLine={true}>
              {pieData.map((d,i)=><Cell key={i} fill={d.color}/>)}
            </Pie>
            <Tooltip formatter={v=>[vf(v)]} contentStyle={tt}/>
          </PieChart>
        </ResponsiveContainer>
        <div style={{display:'flex',gap:8,flexWrap:'wrap',justifyContent:'center',marginTop:4}}>
          {pieData.filter(d=>d.value>0).map((d,i)=>(
            <div key={i} style={{display:'flex',alignItems:'center',gap:4,fontSize:11}}>
              <div style={{width:8,height:8,borderRadius:2,background:d.color,flexShrink:0}}/>
              <span style={{color:t.muted}}>{d.name}</span>
            </div>
          ))}
        </div>
      </div>
    );
  };

  const renderBar = (horizontal=false) => (
    <ResponsiveContainer width="100%" height={height}>
      <BarChart data={data} layout={horizontal?'vertical':'horizontal'}>
        <CartesianGrid strokeDasharray="3 3" stroke={t.border} horizontal={!horizontal} vertical={horizontal}/>
        {horizontal
          ? <><XAxis type="number" tick={{fontSize:9,fill:t.muted}} tickFormatter={v=>`${(v/1000).toFixed(0)}K`}/><YAxis type="category" dataKey={nameKey} tick={{fontSize:10,fill:t.muted}} width={110}/></>
          : <><XAxis dataKey={nameKey} tick={{fontSize:10,fill:t.muted}}/><YAxis tick={{fontSize:10,fill:t.muted}} tickFormatter={v=>`${(v/1000).toFixed(0)}K`}/></>
        }
        <Tooltip formatter={(v,n)=>[vf(v),n]} contentStyle={tt}/>
        {series.length>1&&<Legend wrapperStyle={{fontSize:11}}/>}
        {series.map((s,i)=>(
          <Bar key={s.key} dataKey={s.key} name={s.name} stackId={series.length>1?'a':undefined}
            fill={s.color} radius={i===series.length-1?(horizontal?[0,4,4,0]:[4,4,0,0]):[0,0,0,0]}>
            {series.length===1&&data.map((_,j)=><Cell key={j} fill={COLORS[j%COLORS.length]}/>)}
          </Bar>
        ))}
      </BarChart>
    </ResponsiveContainer>
  );

  const renderLine = () => (
    <ResponsiveContainer width="100%" height={height}>
      <LineChart data={data}>
        <CartesianGrid strokeDasharray="3 3" stroke={t.border}/>
        <XAxis dataKey={nameKey} tick={{fontSize:10,fill:t.muted}}/>
        <YAxis tick={{fontSize:10,fill:t.muted}} tickFormatter={v=>`${(v/1000).toFixed(0)}K`}/>
        <Tooltip formatter={(v,n)=>[vf(v),n]} contentStyle={tt}/>
        {series.length>1&&<Legend wrapperStyle={{fontSize:11}}/>}
        {series.map((s,i)=>(
          <Line key={s.key} type="monotone" dataKey={s.key} name={s.name} stroke={s.color} strokeWidth={2} dot={false}/>
        ))}
      </LineChart>
    </ResponsiveContainer>
  );

  const renderArea = () => (
    <ResponsiveContainer width="100%" height={height}>
      <AreaChart data={data}>
        <defs>
          {series.map((s,i)=>(
            <linearGradient key={s.key} id={`sc_${chartId}_${i}`} x1="0" y1="0" x2="0" y2="1">
              <stop offset="5%" stopColor={s.color} stopOpacity={0.3}/>
              <stop offset="95%" stopColor={s.color} stopOpacity={0}/>
            </linearGradient>
          ))}
        </defs>
        <CartesianGrid strokeDasharray="3 3" stroke={t.border}/>
        <XAxis dataKey={nameKey} tick={{fontSize:10,fill:t.muted}}/>
        <YAxis tick={{fontSize:10,fill:t.muted}} tickFormatter={v=>`${(v/1000).toFixed(0)}K`}/>
        <Tooltip formatter={(v,n)=>[vf(v),n]} contentStyle={tt}/>
        {series.length>1&&<Legend wrapperStyle={{fontSize:11}}/>}
        {series.map((s,i)=>(
          <Area key={s.key} type="monotone" dataKey={s.key} name={s.name}
            stroke={s.color} fill={`url(#sc_${chartId}_${i})`} strokeWidth={2}/>
        ))}
      </AreaChart>
    </ResponsiveContainer>
  );

  return(
    <div>
      {/* Type picker */}
      <div style={{display:'flex',gap:4,marginBottom:10,flexWrap:'wrap'}}>
        {CHART_TYPES.map(ct=>(
          <button key={ct.id} onClick={()=>changeType(ct.id)}
            title={ct.label}
            style={{background:type===ct.id?t.accent:t.surface,color:type===ct.id?'#fff':t.muted,
              border:`1px solid ${type===ct.id?t.accent:t.border}`,borderRadius:6,
              padding:'3px 8px',fontSize:11,cursor:'pointer',fontFamily:"'DM Sans',sans-serif",
              display:'flex',alignItems:'center',gap:4,transition:'all .15s'}}>
            <span>{ct.icon}</span><span>{ct.label}</span>
          </button>
        ))}
      </div>
      {/* Chart */}
      {type==='bar'    && renderBar(false)}
      {type==='barH'   && renderBar(true)}
      {type==='line'   && renderLine()}
      {type==='area'   && renderArea()}
      {type==='pie'    && renderPieOrDonut(false)}
      {type==='donut'  && renderPieOrDonut(true)}
      {type==='funnel' && renderFunnel()}
    </div>
  );
}

/* ── SmartCard: Card with SmartChart inside ── */
function ChartCard({title, chartId, data, keys, nameKey='name', height=220, defaultType='bar', valFmt, t, style={}}){
  return(
    <Card title={title} t={t} style={style}>
      <SmartChart chartId={chartId} data={data} keys={keys} nameKey={nameKey}
        height={height} defaultType={defaultType} valFmt={valFmt} t={t}/>
    </Card>
  );
}

/* ── IndexedDB ── */
function openDB(){return new Promise((res,rej)=>{const r=indexedDB.open('collectiq_v2',1);r.onupgradeneeded=e=>e.target.result.createObjectStore('kv');r.onsuccess=e=>res(e.target.result);r.onerror=rej;});}
async function dbSet(k,v){const db=await openDB();return new Promise((res,rej)=>{const tx=db.transaction('kv','readwrite');tx.objectStore('kv').put(v,k);tx.oncomplete=res;tx.onerror=rej;});}
async function dbGet(k){const db=await openDB();return new Promise((res,rej)=>{const r=db.transaction('kv','readonly').objectStore('kv').get(k);r.onsuccess=e=>res(e.target.result);r.onerror=rej;});}
async function dbDel(k){const db=await openDB();return new Promise((res,rej)=>{const tx=db.transaction('kv','readwrite');tx.objectStore('kv').delete(k);tx.oncomplete=res;tx.onerror=rej;});}

/* ── Simple hash for password ── */
async function hashPwd(pwd){const buf=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(pwd));return Array.from(new Uint8Array(buf)).map(b=>b.toString(16).padStart(2,'0')).join('');}

/* ── CSV ── */
function parseCSV(text){if(!text||!text.trim())return[];const lines=text.trim().split(/\r?\n/);if(lines.length<2)return[];const rawHeaders=parseCSVLine(lines[0]).map(h=>h.trim());
// Deduplicate headers: second occurrence becomes "Header_2", third "Header_3" etc.
const headerCount={};const headers=rawHeaders.map(h=>{headerCount[h]=(headerCount[h]||0)+1;return headerCount[h]>1?h+'_'+headerCount[h]:h;});
return lines.slice(1).map(l=>{const vals=parseCSVLine(l);const obj={};headers.forEach((h,i)=>{obj[h]=(vals[i]||'').trim();});return obj;}).filter(r=>Object.values(r).some(v=>v!==''));}
function parseCSVLine(line){const res=[];let cur='',inQ=false;for(let i=0;i<line.length;i++){const c=line[i];if(c==='"'){inQ=!inQ;continue;}if(c===','&&!inQ){res.push(cur);cur='';continue;}cur+=c;}res.push(cur);return res;}
function parseAmt(v){if(!v||v==='-'||v==='')return 0;const n=parseFloat(v.replace(/[",\s$]/g,''));return isNaN(n)?0:n;}
function parseYear(yy){if(!yy)return null;const m=yy.match(/(\d{4})/);return m?parseInt(m[1]):null;}
function fmt(n,d=0){if(n===null||n===undefined||isNaN(n))return'0';return Number(n).toLocaleString('en-US',{minimumFractionDigits:d,maximumFractionDigits:d});}
function pct(a,b){return b?(a/b)*100:0;}
function fmtP(n,d=1){return fmt(n,d)+'%';}

/* ── Sheet 4 Helpers ──
   Sheet 4 now has: Name, Role, Team, Branch, Region, "Reporting to"
   Same person can appear in multiple rows (multiple branches).
   We build a rich org structure from it dynamically.
── */
function buildOrg(s4){
  // Filter out empty rows (no Name AND no Branch with actual content)
  const valid = s4.filter(r => r.Name && r.Name.trim());
  // Deduplicate people: key = Name (person), collect all branches/teams/regions
  const people = {};
  valid.forEach(r => {
    const name = r.Name.trim();
    if(!people[name]) people[name] = {name, role:r.Role||'', teams:[], branches:[], regions:[], reportingTo:r['Reporting to']||r.ReportingTo||''};
    if(r.Team && !people[name].teams.includes(r.Team)) people[name].teams.push(r.Team);
    if(r.Branch && !people[name].branches.includes(r.Branch)) people[name].branches.push(r.Branch);
    if(r.Region && !people[name].regions.includes(r.Region)) people[name].regions.push(r.Region);
  });
  return {valid, people, list: Object.values(people)};
}
function isManager(role){
  const r=(role||'').toLowerCase().trim();
  return r.includes('manager')||r==='higher manager'||r==='regional manager'||r==='team manager'||r.includes('head');
}
function isExecutive(role){
  const r=(role||'').toLowerCase().trim();
  return r!==''&&!isManager(role)&&!r.includes('ceo')&&!r.includes('director');
}
// Commission role category
function commRole(role){
  const r=(role||'').toLowerCase().trim();
  if(r.includes('support head')) return 'support_head';
  if(r.includes('support incharge')||r.includes('support in-charge')) return 'support_incharge';
  if(r==='regional manager'||r.includes('regional sales head')||r.includes('rsm')) return 'regional_head';
  if(r==='team manager'||r==='higher manager'||r.includes('sales manager')||r.includes('manager')) return 'sales_manager';
  if(r.includes('sales consultant')||r.includes('consultant')) return 'sales_consultant';
  if(r.includes('executive')) return 'executive';
  return 'unknown';
}
function getPersonInfo(s4, name){
  // Returns merged info for a person across all their rows
  const rows = s4.filter(r=>r.Name&&r.Name.trim()===name.trim());
  if(!rows.length) return {};
  return {
    Name: name,
    Role: rows[0].Role||'',
    Team: rows.map(r=>r.Team).filter(Boolean).join(', '),
    Branch: rows.map(r=>r.Branch).filter(Boolean).join(', '),
    Region: rows.map(r=>r.Region).filter(Boolean).join(', '),
    ReportingTo: rows[0]['Reporting to']||rows[0].ReportingTo||'',
    rows
  };
}

/* ── Shared UI ── */
function KPI({label,value,sub,t,ac}){return(<div style={{background:t.card,border:`1px solid ${t.border}`,borderRadius:12,padding:'16px 20px'}}><div style={{fontSize:11,fontWeight:700,color:t.muted,textTransform:'uppercase',letterSpacing:'.6px',marginBottom:8}}>{label}</div><div style={{fontSize:22,fontWeight:700,color:ac||t.text,fontFamily:"'DM Mono',monospace"}}>{value}</div>{sub&&<div style={{fontSize:12,color:t.muted,marginTop:4}}>{sub}</div>}</div>);}
function Card({children,title,t,style={},action}){return(<div style={{background:t.card,border:`1px solid ${t.border}`,borderRadius:12,padding:'18px 20px',...style}}>{title&&<div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:14}}><div style={{fontSize:11,fontWeight:700,color:t.muted,textTransform:'uppercase',letterSpacing:'.7px'}}>{title}</div>{action}</div>}{children}</div>);}
function Badge({text,type='blue'}){const m={blue:{bg:'#dbeafe',c:'#1e40af'},green:{bg:'#d1fae5',c:'#065f46'},amber:{bg:'#fef3c7',c:'#92400e'},red:{bg:'#fee2e2',c:'#991b1b'},purple:{bg:'#ede9fe',c:'#5b21b6'},gray:{bg:'#f1f5f9',c:'#475569'}};const col=m[type]||m.blue;return <span style={{display:'inline-block',fontSize:11,padding:'2px 9px',borderRadius:20,fontWeight:600,background:col.bg,color:col.c,whiteSpace:'nowrap'}}>{text}</span>;}
function MiniBar({value,max,color='#3b82f6',t}){return(<div style={{background:t.surface,borderRadius:4,height:5,flex:1}}><div style={{height:5,borderRadius:4,background:color,width:`${Math.min(100,pct(value,max||1))}%`,transition:'width .3s'}}/></div>);}
function Chip({label,active,onClick,t}){return(<span onClick={onClick} style={{display:'inline-block',fontSize:11,padding:'3px 9px',borderRadius:6,margin:2,cursor:'pointer',border:`1px solid ${active?t.accent:t.border}`,background:active?t.accent:t.surface,color:active?'#fff':t.muted,transition:'all .15s'}}>{label}</span>);}
function FG({label,children,t}){const[o,sO]=useState(true);return(<div style={{background:t.card,border:`1px solid ${t.border}`,borderRadius:10,padding:'12px 14px',marginBottom:10}}><div onClick={()=>sO(x=>!x)} style={{display:'flex',justifyContent:'space-between',cursor:'pointer',fontSize:11,fontWeight:700,color:t.muted,textTransform:'uppercase',letterSpacing:'.6px',marginBottom:o?8:0}}>{label}<span>{o?'▾':'▸'}</span></div>{o&&<div>{children}</div>}</div>);}
function Btn({children,onClick,primary,t,disabled,style={}}){return(<button onClick={onClick} disabled={disabled} style={{background:primary?t.accent:t.surface,color:primary?'#fff':t.text,border:`1px solid ${primary?t.accent:t.border}`,borderRadius:8,padding:'7px 14px',fontSize:13,fontWeight:600,cursor:disabled?'not-allowed':'pointer',opacity:disabled?0.5:1,fontFamily:"'DM Sans',sans-serif",...style}}>{children}</button>);}
function TH({children,t,right}){return <th style={{textAlign:right?'right':'left',padding:'8px 10px',borderBottom:`1px solid ${t.border}`,fontSize:11,fontWeight:700,color:t.muted,textTransform:'uppercase',letterSpacing:'.5px',whiteSpace:'nowrap'}}>{children}</th>;}
function TD({children,t,mono,color,right,bold,style={}}){return <td style={{padding:'7px 10px',borderBottom:`1px solid ${t.border}`,fontFamily:mono?"'DM Mono',monospace":undefined,fontSize:mono?12:13,color:color||t.text,textAlign:right?'right':'left',fontWeight:bold?700:400,...style}}>{children}</td>;}

/* ── AI Insights (calls Anthropic API) ── */
function AIInsights({prompt,t,label='AI Insights'}){
  const[text,setText]=useState('');const[loading,setLoading]=useState(false);const[done,setDone]=useState(false);
  const run=async()=>{
    setLoading(true);setText('');setDone(false);
    // Use Pollinations.ai text API — free, no API key needed, works from browser
    try{
      const encoded=encodeURIComponent(prompt);
      const res=await fetch(`https://text.pollinations.ai/${encoded}`,{method:'GET'});
      if(!res.ok) throw new Error(`HTTP ${res.status}`);
      const txt=await res.text();
      setText(txt.trim());setDone(true);
    }catch(e){
      // Fallback: try openrouter free tier
      try{
        const res2=await fetch('https://openrouter.ai/api/v1/chat/completions',{
          method:'POST',
          headers:{'Content-Type':'application/json','HTTP-Referer':'https://collectiq.local','X-Title':'CollectIQ'},
          body:JSON.stringify({model:'mistralai/mistral-7b-instruct:free',messages:[{role:'user',content:prompt}]})
        });
        const d=await res2.json();
        const txt2=(d.choices&&d.choices[0]&&d.choices[0].message&&d.choices[0].message.content)||'No response received';
        setText(txt2.trim());setDone(true);
      }catch(e2){
        setText('AI insights unavailable — check internet connection and try again.\n\nError: '+e2.message);
        setDone(true);
      }
    }
    setLoading(false);
  };
  return(<div style={{marginTop:16,background:t.surface,border:`1px solid ${t.border}`,borderRadius:10,overflow:'hidden'}}>
    <div style={{padding:'10px 16px',display:'flex',justifyContent:'space-between',alignItems:'center',borderBottom:done||loading?`1px solid ${t.border}`:'none'}}>
      <div style={{display:'flex',alignItems:'center',gap:8}}><span style={{fontSize:16}}>✨</span><span style={{fontSize:12,fontWeight:700,color:t.muted,textTransform:'uppercase',letterSpacing:'.6px'}}>{label}</span><span style={{fontSize:10,color:t.muted,background:t.surface,border:`1px solid ${t.border}`,borderRadius:4,padding:'1px 5px'}}>Free AI</span></div>
      {!done&&<Btn t={t} primary onClick={run} disabled={loading} style={{padding:'5px 12px',fontSize:12}}>{loading?<span className="spin">⟳</span>:'Generate'}</Btn>}
      {done&&<Btn t={t} onClick={run} style={{padding:'5px 12px',fontSize:12}}>↻ Refresh</Btn>}
    </div>
    {(loading||done)&&<div style={{padding:'14px 16px',fontSize:13,lineHeight:1.8,color:t.text,whiteSpace:'pre-wrap'}} className={done?'fadein':''}>{loading?<div style={{display:'flex',alignItems:'center',gap:8,color:t.muted}}><span className="spin">⟳</span> Generating insights...</div>:text}</div>}
  </div>);
}

/* ── Password Gate ── */
function PasswordGate({t,onUnlock}){
  const[pwd,setPwd]=useState('');const[err,setErr]=useState('');
  const check=async()=>{
    const h=await hashPwd(pwd);
    const stored=await dbGet('pwd_hash');
    if(!stored){await dbSet('pwd_hash',h);onUnlock();}
    else if(h===stored){onUnlock();}
    else{setErr('Incorrect password');setPwd('');}
  };
  return(<div style={{minHeight:'100vh',background:t.bg,display:'flex',alignItems:'center',justifyContent:'center'}}>
    <div style={{background:t.card,border:`1px solid ${t.border}`,borderRadius:16,padding:40,width:360,textAlign:'center'}}>
      <div style={{fontSize:40,marginBottom:16}}>🔐</div>
      <div style={{fontSize:20,fontWeight:700,color:t.text,marginBottom:8}}>Focus Dashboard</div>
      <div style={{fontSize:13,color:t.muted,marginBottom:24}}>Enter your password to continue</div>
      <Inp value={pwd} onChange={e=>{setPwd(e.target.value);setErr('');}} placeholder="Password" t={t} type="password" style={{marginBottom:12,textAlign:'center'}}/>
      {err&&<div style={{fontSize:12,color:t.danger,marginBottom:10}}>{err}</div>}
      <Btn primary t={t} onClick={check} style={{width:'100%',padding:'10px',fontSize:14}}>Unlock</Btn>
      <div style={{fontSize:11,color:t.muted,marginTop:16}}>First time? Any password you enter becomes the master password.</div>
    </div>
  </div>);
}

/* ── Security Tab ── */
function SecurityTab({t,onLock,credit,onSaveCredit}){
  const[cur,setCur]=useState('');const[np,setNp]=useState('');const[np2,setNp2]=useState('');const[msg,setMsg]=useState('');const[msgType,setMsgType]=useState('');
  const m=(txt,tp)=>{setMsg(txt);setMsgType(tp);setTimeout(()=>setMsg(''),3000);};
  const change=async()=>{
    if(!cur||!np||!np2){m('Fill all fields','danger');return;}
    if(np!==np2){m('New passwords do not match','danger');return;}
    if(np.length<4){m('Password too short (min 4 chars)','danger');return;}
    const curH=await hashPwd(cur);const stored=await dbGet('pwd_hash');
    if(stored&&curH!==stored){m('Current password incorrect','danger');return;}
    await dbSet('pwd_hash',await hashPwd(np));
    m('Password updated ✓','success');setCur('');setNp('');setNp2('');
  };
  const remove=async()=>{
    if(!cur){m('Enter current password first','danger');return;}
    const curH=await hashPwd(cur);const stored=await dbGet('pwd_hash');
    if(stored&&curH!==stored){m('Current password incorrect','danger');return;}
    await dbDel('pwd_hash');
    m('Password removed — dashboard is now open','success');setCur('');
  };
  return(<div style={{maxWidth:460}}>
    <Card title="Password Protection" t={t}>
      <div style={{fontSize:13,color:t.muted,marginBottom:20,lineHeight:1.6}}>Set a password to protect this dashboard. The password hash is stored locally in your browser — it never leaves your device.</div>
      {[['Current Password',cur,setCur],['New Password',np,setNp],['Confirm New Password',np2,setNp2]].map(([lbl,val,set])=>(
        <div key={lbl} style={{marginBottom:12}}>
          <label style={{fontSize:12,fontWeight:600,color:t.muted,display:'block',marginBottom:5}}>{lbl}</label>
          <Inp value={val} onChange={e=>{set(e.target.value);setMsg('');}} placeholder="••••••••" t={t} type="password"/>
        </div>
      ))}
      {msg&&<div style={{fontSize:13,color:t[msgType]||t.text,marginBottom:12,padding:'8px 12px',background:t.surface,borderRadius:6}}>{msg}</div>}
      <div style={{display:'flex',gap:10,flexWrap:'wrap'}}>
        <Btn primary t={t} onClick={change}>Update Password</Btn>
        <Btn t={t} onClick={remove} style={{color:t.danger,borderColor:t.danger}}>Remove Password</Btn>
        <Btn t={t} onClick={onLock}>🔒 Lock Now</Btn>
      </div>
    </Card>

    {/* Credit editor */}
    <Card title="Credit Label" t={t} style={{marginTop:16}}>
      <div style={{fontSize:13,color:t.muted,marginBottom:16,lineHeight:1.6}}>
        Edit the name and email shown in the top bar. Protected by a separate access password.
      </div>
      <CreditEditor t={t} credit={credit} onSave={onSaveCredit}/>
    </Card>
  </div>);
}

function GoogleSheetsTester({t}){
  const[url,setUrl]=useState('');
  const[status,setStatus]=useState(null);
  const PROXIES=[
    {name:'Direct',fn:u=>u},
    {name:'allorigins.win',fn:u=>`https://api.allorigins.win/raw?url=${encodeURIComponent(u)}`},
    {name:'corsproxy.io',fn:u=>`https://corsproxy.io/?${encodeURIComponent(u)}`},
    {name:'cors-anywhere (herokuapp)',fn:u=>`https://cors-anywhere.herokuapp.com/${u}`},
  ];
  const test=async()=>{
    if(!url.trim()){setStatus({ok:false,error:'Please enter a URL'});return;}
    setStatus('loading');
    for(const proxy of PROXIES){
      try{
        const fetchUrl=proxy.fn(url.trim());
        const res=await fetch(fetchUrl,{signal:AbortSignal.timeout(8000)});
        if(!res.ok)continue;
        const text=await res.text();
        if(!text.trim()||text.trim().startsWith('<'))continue;
        const lines=text.trim().split(/\r?\n/);
        const headers=lines[0].split(',').map(h=>h.replace(/"/g,'').trim());
        const preview=lines.slice(1,4).map(l=>l.substring(0,120));
        setStatus({ok:true,proxy:proxy.name,rows:lines.length-1,cols:headers.length,headers,preview});
        return;
      }catch(e){continue;}
    }
    setStatus({ok:false,error:'All methods failed (Direct + 3 proxies). Google Sheet must be published publicly: File → Share → Publish to web → CSV. If already done, try opening the URL directly in a browser tab first.'});
  };
  return(
    <div style={{marginTop:20,background:t.card,border:`1px solid ${t.border}`,borderRadius:12,padding:'16px 18px'}}>
      <div style={{fontSize:11,fontWeight:700,color:t.muted,textTransform:'uppercase',letterSpacing:'.6px',marginBottom:4}}>Google Sheets URL Tester</div>
      <div style={{fontSize:12,color:t.muted,marginBottom:12,lineHeight:1.6}}>
        To get a URL: open Google Sheet → <strong style={{color:t.text}}>File → Share → Publish to web</strong> → select the sheet tab → choose <strong style={{color:t.text}}>CSV</strong> → Publish → copy the link.
      </div>
      <div style={{display:'flex',gap:8,marginBottom:12}}>
        <input value={url} onChange={e=>setUrl(e.target.value)} placeholder="https://docs.google.com/spreadsheets/d/.../pub?gid=...&single=true&output=csv" style={{flex:1,padding:'8px 12px',borderRadius:8,border:'1px solid '+t.border,background:t.surface,color:t.text,fontSize:12,fontFamily:"'DM Sans',sans-serif",outline:'none'}}/>
        <button onClick={test} disabled={status==='loading'} style={{padding:'8px 18px',background:t.accent,color:'#fff',border:'none',borderRadius:8,fontSize:13,fontWeight:600,cursor:'pointer',whiteSpace:'nowrap',fontFamily:"'DM Sans',sans-serif"}}>
          {status==='loading'?'Testing...':'🔗 Test URL'}
        </button>
      </div>
      {status&&status!=='loading'&&(
        <div style={{borderRadius:8,padding:'12px 14px',background:status.ok?'#d1fae522':'#fee2e222',border:`1px solid ${status.ok?'#6ee7b7':'#fca5a5'}`}}>
          {status.ok?(
            <div>
              <div style={{fontWeight:700,color:'#065f46',fontSize:13,marginBottom:6}}>✅ Success via <strong>{status.proxy}</strong></div>
              <div style={{fontSize:12,color:t.muted,marginBottom:4}}><strong style={{color:t.text}}>{status.rows}</strong> data rows · <strong style={{color:t.text}}>{status.cols}</strong> columns</div>
              <div style={{fontSize:11,color:t.muted,marginBottom:6}}>Columns: {status.headers.slice(0,8).join(', ')}{status.headers.length>8?` +${status.headers.length-8} more`:''}</div>
              <div style={{fontSize:10,fontFamily:"'DM Mono',monospace",color:t.muted,background:t.surface,borderRadius:6,padding:'8px 10px',lineHeight:1.6}}>
                {status.preview.map((l,i)=><div key={i} style={{overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}}>{l}</div>)}
              </div>
            </div>
          ):(
            <div style={{fontSize:12,color:'#b91c1c'}}><strong>❌ Failed:</strong> {status.error}</div>
          )}
        </div>
      )}
    </div>
  );
}

      <span style={{fontSize:13,color:t.muted}}>Q1 25% · Q2 20% · Q3 20% · Q4 35%</span>
      <div style={{marginLeft:"auto",display:"flex",gap:8}}>
        <Btn t={t} onClick={()=>{const b=new Blob([JSON.stringify(local,null,2)],{type:"application/json"});const a=document.createElement("a");a.href=URL.createObjectURL(b);a.download="targets.json";a.click();}}>⬇ Export</Btn>
        <label style={{background:t.surface,border:"1px solid "+t.border,borderRadius:8,padding:"7px 14px",fontSize:13,cursor:"pointer",color:t.text}}>⬆ Import<input type="file" accept=".json" style={{display:"none"}} onChange={e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=ev=>{try{const d=JSON.parse(ev.target.result);saveTargets(d);setLocal(d);}catch(ex){alert("Invalid JSON");}};r.readAsText(f);}}/></label>
      </div>
    </div>
    <Card title={"Team Targets — "+year} t={t} style={{marginBottom:16}}>
      <div style={{overflowX:"auto"}}><table style={{width:"100%",borderCollapse:"collapse"}}>
        <thead><tr>{["Team","Annual Target","Q1","Q2","Q3","Q4"].map(l=><TH key={l} t={t}>{l}</TH>)}</tr></thead>
        <tbody>{teams.map(team=>{
          const k="team_"+team+"_"+year;
          const v=parseFloat(local[k]||0);
          const alloc=allExecs.filter(p=>p.teams&&p.teams.includes(team)).reduce((s,p)=>s+parseFloat(local["target_"+p.name+"_"+year]||0),0);
          const ua=v-alloc;
          return(<tr key={team}>
            <TD t={t}><div style={{fontWeight:500}}>{team}</div>{v>0&&<div style={{fontSize:11,color:ua<0?t.danger:t.success}}>Unalloc: AED {fmt(ua)}</div>}</TD>
            <TD t={t}><input type="number" value={local[k]||""} placeholder="0" onChange={e=>setT(k,e.target.value)} style={ii}/></TD>
            {QTRS.map(({q,w})=><TD key={q} t={t} mono right>AED {fmt(v*w/100)}</TD>)}
          </tr>);
        })}</tbody>
      </table></div>
    </Card>
    <Card title={"Individual Targets — "+year+(selBranch?" · "+selBranch:"")} t={t} style={{marginBottom:16}}>
      <div style={{overflowX:"auto"}}><table style={{width:"100%",borderCollapse:"collapse"}}>
        <thead><tr>{["Executive","Role","Branch","Annual Target","Monthly Salary"].map(l=><TH key={l} t={t}>{l}</TH>)}</tr></thead>
        <tbody>{execs.map(p=>{
          const name=p.name;
          const info=getPersonInfo(sheets.s4,name);
          return(<tr key={name}>
            <TD t={t}><span style={{fontWeight:500}}>{name}</span></TD>
            <TD t={t}><Badge text={info.Role||"—"} type={isManager(info.Role)?"purple":"green"}/></TD>
            <TD t={t} color={t.muted}>{info.Branch||"—"}</TD>
            <TD t={t}><input type="number" placeholder="0" value={local["target_"+name+"_"+year]||""} onChange={e=>setT("target_"+name+"_"+year,e.target.value)} style={ii}/></TD>
            <TD t={t}><input type="number" placeholder="0" value={local["salary_"+name]||""} onChange={e=>setT("salary_"+name,e.target.value)} style={ii}/></TD>
          </tr>);
        })}</tbody>
      </table></div>
    </Card>
    <Card title={"Quarterly Renewal Targets, Spillover and Bonus Eligibility — "+year} t={t} style={{marginBottom:16}}>
      <div style={{fontSize:12,color:t.muted,marginBottom:10,lineHeight:1.6}}>
        <strong style={{color:t.text}}>Q Renewal Target:</strong> Renewal amount expected this quarter including pending from prior Q.<br/>
        <strong style={{color:t.text}}>Spillover:</strong> Unmet target from previous Q added to this Q bonus target.<br/>
        <strong style={{color:t.text}}>Bonus Eligible?</strong> Set No if employee missed bonus last Q (90% slab forfeited next Q, 100% slab reduced to 25%).
      </div>
      <div style={{overflowX:"auto"}}><table style={{width:"100%",borderCollapse:"collapse",fontSize:12}}>
        <thead><tr>
          <TH t={t}>Executive</TH>
          {QTRS.map(({q})=>[
            <TH key={q+"r"} t={t}>{q} Renewal Tgt</TH>,
            <TH key={q+"s"} t={t}>{q} Spillover</TH>,
            <TH key={q+"b"} t={t}>{q} Bonus?</TH>,
          ])}
        </tr></thead>
        <tbody>{execs.map(p=>{
          const name=p.name;
          return(<tr key={name}>
            <TD t={t} style={{fontWeight:500,whiteSpace:"nowrap",fontSize:12}}>{name}</TD>
            {QTRS.map(({q})=>[
              <TD key={q+"r"} t={t}><input type="number" placeholder="0" value={local["renewals_q_"+name+"_"+year+"_"+q]||""} onChange={e=>setT("renewals_q_"+name+"_"+year+"_"+q,e.target.value)} style={{...ii,width:85}}/></TD>,
              <TD key={q+"s"} t={t}><input type="number" placeholder="0" value={local["spillover_"+name+"_"+year+"_"+q]||""} onChange={e=>setT("spillover_"+name+"_"+year+"_"+q,e.target.value)} style={{...ii,width:85}}/></TD>,
              <TD key={q+"b"} t={t}>
                <select value={local["bonus_eligible_"+name+"_"+year+"_"+q]||""} onChange={e=>setT("bonus_eligible_"+name+"_"+year+"_"+q,e.target.value)} style={{...ii,width:75}}>
                  <option value="">Yes</option>
                  <option value="0">No</option>
                </select>
              </TD>,
            ])}
          </tr>);
        })}</tbody>
      </table></div>
    </Card>
  </div>);
}

function CommissionTab({sheets,targets,t,dark}){
  const[sel,setSel]=useState('');
  const[year,setYear]=useState(new Date().getFullYear());
  const[qtr,setQtr]=useState('Q1');
  const[nsAmt,setNsAmt]=useState('');const[rnAmt,setRnAmt]=useState('');
  const[nsOverride,setNsOverride]=useState(false);const[rnOverride,setRnOverride]=useState(false);
  const[nsStreams,setNsStreams]=useState(DEFAULT_NS_STREAMS);
  const[rnStreams,setRnStreams]=useState(DEFAULT_RN_STREAMS);
  const[showStreamEdit,setShowStreamEdit]=useState(false);
  const[showCodeEditor,setShowCodeEditor]=useState(false);
  const curYear=new Date().getFullYear();
  const ii={background:t.surface,border:`1px solid ${t.border}`,borderRadius:8,padding:'8px 12px',fontSize:13,color:t.text,fontFamily:"'DM Sans',sans-serif",width:'100%'};

  const execList=useMemo(()=>{const org=buildOrg(sheets.s4);return org.list.map(p=>p.name).sort();},[sheets.s4]);
  const info=useMemo(()=>getPersonInfo(sheets.s4,sel),[sel,sheets.s4]);
  const role=useMemo(()=>(info.Role||'').trim(),[info]);
  const salary=useMemo(()=>parseFloat(targets[`salary_${sel}`]||0),[targets,sel]);

  // ── Auto-calculate from transactions ─────────────────────────────────────
  const autoCalc=useMemo(()=>{
    if(!sel)return{ns:0,rn:0};
    const qMos=Q_MONTHS[qtr]||[];
    const srcSheet=year===curYear?sheets.s2:[...sheets.s1,...sheets.s2];
    const rows=srcSheet.filter(r=>{
      const ry=parseYear(r.yy||r.Year||r.year);
      return ry===year&&((r.Employee&&r.Employee.trim()===sel)||(r.Executive&&r.Executive.trim()===sel));
    });
    const isSalesConsultant=role.toLowerCase().includes('sales consultant');
    let ns,rn;
    if(isSalesConsultant){
      // All collections into ns regardless of stream; rn forced to zero
      ns=rows.filter(r=>qMos.includes(r.Month)).reduce((s,r)=>s+parseAmt(r.Collection||r['Collection Amount']||r.Amount||0),0);
      rn=0;
    }else{
      ns=rows.filter(r=>qMos.includes(r.Month)&&nsStreams.some(s=>s.toLowerCase()===(r.Stream||r.stream||'').toLowerCase().trim())).reduce((s,r)=>s+parseAmt(r.Collection||r['Collection Amount']||r.Amount||0),0);
      rn=rows.filter(r=>qMos.includes(r.Month)&&rnStreams.some(s=>s.toLowerCase()===(r.Stream||r.stream||'').toLowerCase().trim())).reduce((s,r)=>s+parseAmt(r.Collection||r['Collection Amount']||r.Amount||0),0);
    }
    return{ns,rn};
  },[sel,year,qtr,role,sheets.s1,sheets.s2,nsStreams,rnStreams,curYear]);

  const ns=nsOverride?parseFloat(nsAmt)||0:autoCalc.ns;
  const rn=rnOverride?parseFloat(rnAmt)||0:autoCalc.rn;
  useEffect(()=>{if(!nsOverride)setNsAmt(autoCalc.ns>0?String(autoCalc.ns):'');},[autoCalc.ns,nsOverride]);
  useEffect(()=>{if(!rnOverride)setRnAmt(autoCalc.rn>0?String(autoCalc.rn):'');},[autoCalc.rn,rnOverride]);
  useEffect(()=>{setNsOverride(false);setRnOverride(false);},[sel,year,qtr]);

  // ── Targets ────────────────────────────────────────────────────────────────
  // Annual target and quarterly distribution
  const annTarget  = parseFloat(targets[`target_${sel}_${year}`]||0);
  // Q sales target = (Q% of annual) - Q renewal target
  const qRenewTgt  = parseFloat(targets[`renewals_q_${sel}_${year}_${qtr}`]||targets[`renewals_${sel}_${year}`]||0);
  const qTotalTgt  = annTarget*(Q_WEIGHTS[qtr]||0.25);  // full Q target
  const qSalesTgt  = Math.max(0, qTotalTgt - qRenewTgt); // Q sales target = Q total - Q renewal

  // Percentages
  const qSalesPct  = qSalesTgt?pct(ns,qSalesTgt):0;   // vs sales-only target
  const qTotalPct  = qTotalTgt?pct(ns+rn,qTotalTgt):0; // vs total Q target
  const rnPct      = qRenewTgt?pct(rn,qRenewTgt):0;    // renewals vs Q renewal target
  const ytdPct     = annTarget?pct(ns+rn,annTarget):0;  // overall YTD

  // ── Commission calculation ─────────────────────────────────────────────────
  /*COMMISSION_LOGIC_START*/
  const result=useMemo(()=>{
    if(!sel)return null;
    const r=role.toLowerCase();
    let nc=0,rc=0,nb='Role not configured',rb='Role not configured';

    if(r.includes('support incharge')||r.includes('support in-charge')){
      /*
       * SUPPORT INCHARGE - SALES commission (on QTD sales collections)
       * Sales target for Q = Q total target - Q renewal target
       * Slabs applied to (ns / qSalesTgt):
       *   0%+  → 1%  (from first dirham)
       *  70%+  → 3%  (over all)
       *  80%+  → 4%  (over all)
       * 100%+  → 5%  (over all)
       */
      if(qSalesTgt>0){
        if(qSalesPct>=100){nc=ns*0.05;nb='≥100% of sales target → 5% on all sales collected';}
        else if(qSalesPct>=80){nc=ns*0.04;nb='≥80% of sales target → 4% on all sales collected';}
        else if(qSalesPct>=70){nc=ns*0.03;nb='≥70% of sales target → 3% on all sales collected';}
        else{nc=ns*0.01;nb='<70% of sales target → 1% on all sales collected';}
      }else{nc=ns*0.01;nb='No sales target set — using 1% default';}

      /*
       * SUPPORT INCHARGE - RENEWALS commission (on QTD renewal collections)
       * vs (Q renewal target + any pending from previous Q)
       * Slabs applied to (rn / qRenewTgt):
       *  70%+  → 2.50%
       *  80%+  → 2.75%
       * 100%+  → 3.00%
       *  <70%  → 0%
       */
      if(qRenewTgt>0){
        if(rnPct>=100){rc=rn*0.03;rb='≥100% of renewal target → 3.00% on renewals';}
        else if(rnPct>=80){rc=rn*0.0275;rb='≥80% of renewal target → 2.75% on renewals';}
        else if(rnPct>=70){rc=rn*0.025;rb='≥70% of renewal target → 2.50% on renewals';}
        else{rc=0;rb='<70% of renewal target → 0% renewals commission';}
      }else{rb='No Q renewal target set';}

    } else if(r.includes('sales consultant')||r.includes('consultant')){
      /*
       * SALES CONSULTANT - SALES commission (on QTD sales collections, new logos only)
       * Slabs vs Q target (qTotalTgt used since no renewal target for consultants):
       *   0 → <60%   → 2%  over all
       *  60 → <75%   → 4%  over all
       *  75 → <100%  → 6%  over all
       * 100%+         → 6% on target amount + 10% DIFFERENTIAL on excess above target
       * No renewals commission.
       */
      const pctVsQ=qTotalTgt?pct(ns,qTotalTgt):0;
      if(pctVsQ>=100){
        nc=(qTotalTgt*0.06)+((ns-qTotalTgt)*0.10);
        nb=`≥100%: 6% on AED ${fmt(qTotalTgt)} + 10% differential on AED ${fmt(Math.max(0,ns-qTotalTgt))} excess`;
      } else if(pctVsQ>=75){nc=ns*0.06;nb='≥75% of Q target → 6% on all collected';}
      else if(pctVsQ>=60){nc=ns*0.04;nb='≥60% of Q target → 4% on all collected';}
      else{nc=ns*0.02;nb='<60% of Q target → 2% on all collected';}
      rc=0;rb='No renewals commission for Sales Consultant';

    } else if(r.includes('support head')){
      if(qTotalPct>=100){nc=(ns)*0.025;nb='≥100% → 2.50%';}
      else if(qTotalPct>=80){nc=(ns)*0.02;nb='≥80% → 2.00%';}
      else if(qTotalPct>=70){nc=(ns)*0.015;nb='≥70% → 1.50%';}
      else{nc=0;nb='<70% → 0%';}
      if(rnPct>=100){rc=rn*0.02;rb='≥100% → 2.00%';}
      else if(rnPct>=90){rc=rn*0.015;rb='≥90% → 1.50%';}
      else if(rnPct>=80){rc=rn*0.01;rb='≥80% → 1.00%';}
      else{rc=0;rb='<80% → 0%';}

    } else if(r.includes('regional sales head')||r.includes('rsm')){
      const gate=qTotalPct>=70;
      if(qTotalPct>=100){nc=ns*0.0125;nb='≥100% → 1.25%';}
      else if(qTotalPct>=85){nc=ns*0.009;nb='≥85% → 0.90%';}
      else if(qTotalPct>=60){nc=ns*0.0055;nb='≥60% → 0.55%';}
      else{nc=0;nb='<60% → 0%';}
      if(gate){
        if(rnPct>=100){rc=rn*0.01;rb='≥100% → 1.00%';}
        else if(rnPct>=85){rc=rn*0.0075;rb='≥85% → 0.75%';}
        else if(rnPct>=75){rc=rn*0.005;rb='≥75% → 0.50%';}
        else{rc=0;rb='<75% → 0%';}
      }else rb='🔒 Gate locked (need ≥70% total first)';

    } else if(r.includes('sales manager')||r.includes('manager')){
      const gate=qTotalPct>=70;
      if(qTotalPct>=100){nc=ns*0.015;nb='≥100% → 1.50%';}
      else if(qTotalPct>=85){nc=ns*0.0115;nb='≥85% → 1.15%';}
      else if(qTotalPct>=60){nc=ns*0.008;nb='≥60% → 0.80%';}
      else{nc=0;nb='<60% → 0%';}
      if(gate){
        if(rnPct>=100){rc=rn*0.0125;rb='≥100% → 1.25%';}
        else if(rnPct>=85){rc=rn*0.01;rb='≥85% → 1.00%';}
        else if(rnPct>=75){rc=rn*0.0075;rb='≥75% → 0.75%';}
        else{rc=0;rb='<75% → 0%';}
      }else rb='🔒 Gate locked (need ≥70% total first)';

    } else {
      nb=`Role "${role}" not matched — check Sheet 4`;rb='N/A';
    }

    /*
     * QUARTERLY BONUS (applies to all roles)
     * Bonus target = Q total target + spillover from previous Q (missed target carried over).
     * Stored as: targets[`spillover_${sel}_${year}_${qtr}`]
     *
     * If employee DID achieve a bonus slab in previous Q (normal eligibility):
     *   ≥90% of bonus target  → 25% of one monthly salary
     *   ≥100% of bonus target → 50% of one monthly salary
     *
     * If employee did NOT achieve any bonus slab in previous Q (penalty mode):
     *   ≥90% of bonus target  → 0  (slab 1 forfeited)
     *   ≥100% of bonus target → 25% of one monthly salary (reduced from 50%)
     *   <90%                  → 0
     *
     * Q1 is always treated as normal eligibility (no previous Q to penalise from).
     * Previous Q eligibility flag stored as: targets[`bonus_eligible_${sel}_${year}_${prevQ}`]
     * Value '0' = missed bonus last Q, anything else (or absent) = normal.
     */
    const qIdx=['Q1','Q2','Q3','Q4'].indexOf(qtr);
    const prevQ=qIdx>0?['Q1','Q2','Q3','Q4'][qIdx-1]:null;
    const prevMissed=prevQ?targets[`bonus_eligible_${sel}_${year}_${prevQ}`]==='0':false;
    // Spillover = any unmet target carried forward from previous Q
    const spillover=parseFloat(targets[`spillover_${sel}_${year}_${qtr}`]||0);
    const bonusTgt=qTotalTgt+spillover; // effective target for bonus purposes
    const bonusPct=bonusTgt?pct(ns+rn,bonusTgt):qTotalPct;
    let bonus=0,bonusNote='';
    if(prevMissed){
      // Penalty mode: 90% slab forfeited, 100%+ slab reduced to 25%
      if(bonusPct>=100){
        bonus=salary*0.25;
        bonusNote=`Penalty (missed ${prevQ} bonus): Slab 2 reduced → 25% of salary = AED ${fmt(bonus)}${spillover>0?` | Includes AED ${fmt(spillover)} spillover`:''}`;
      } else if(bonusPct>=90){
        bonus=0;
        bonusNote=`Penalty (missed ${prevQ} bonus): 90% slab forfeited → AED 0${spillover>0?` | Includes AED ${fmt(spillover)} spillover`:''}`;
      } else {
        bonusNote=`Below 90% (${fmtP(bonusPct)}) — no bonus${spillover>0?` | Includes AED ${fmt(spillover)} spillover`:''}`;
      }
    } else {
      // Normal eligibility
      if(bonusPct>=100){
        bonus=salary*0.50;
        bonusNote=`Slab 2 (≥100%): 50% of monthly salary = AED ${fmt(bonus)}${spillover>0?` | Includes AED ${fmt(spillover)} spillover`:''}`;
      } else if(bonusPct>=90){
        bonus=salary*0.25;
        bonusNote=`Slab 1 (≥90%): 25% of monthly salary = AED ${fmt(bonus)}${spillover>0?` | Includes AED ${fmt(spillover)} spillover`:''}`;
      } else {
        bonusNote=`Below 90% (${fmtP(bonusPct)}) — no bonus${spillover>0?` | Includes AED ${fmt(spillover)} spillover`:''}`;
      }
    }

    const total=nc+rc+bonus;
    // What-if: next commission slab for sales
    const salesPctToUse=r.includes('sales consultant')||r.includes('consultant')?qTotalPct:qSalesPct;
    const slabs=[60,70,75,80,100];
    const nextSlab=slabs.find(s=>s>salesPctToUse);
    const salesTgtToUse=r.includes('sales consultant')||r.includes('consultant')?qTotalTgt:qSalesTgt;
    const whatif=nextSlab&&salesTgtToUse?
      `Need AED ${fmt(Math.max(0,(salesTgtToUse*nextSlab/100)-ns))} more sales to reach ${nextSlab}% (next slab)`:
      'At or above 100% — keep it up!';

    return{nc,rc,nb,rb,bonus,bonusNote,total,whatif,qSalesPct,rnPct,qTotalPct,bonusPct,prevMissed,spillover};
  },[sel,role,ns,rn,qSalesPct,rnPct,qTotalPct,qSalesTgt,qTotalTgt,qRenewTgt,salary,qtr,targets]);
  /*COMMISSION_LOGIC_END*/

  const debugMsg=sel&&!role?'⚠️ Employee found but Role is empty in Sheet 4':
    sel&&role&&!['support head','support incharge','support in-charge','regional sales head','rsm','sales manager','manager','sales consultant','consultant'].some(r=>role.toLowerCase().includes(r))?
    `⚠️ Role "${role}" not recognised — check Sheet 4 spelling`:'';

  function CRow({label,amount,note,warn}){return(
    <div style={{display:'flex',justifyContent:'space-between',alignItems:'flex-start',padding:'10px 0',borderBottom:`1px solid ${t.border}`}}>
      <div><div style={{fontSize:13,fontWeight:500,color:t.text}}>{label}</div>
      <div style={{fontSize:11,color:warn?t.danger:t.muted,marginTop:3}}>{note}</div></div>
      <div style={{fontSize:16,fontWeight:700,fontFamily:"'DM Mono',monospace",color:amount>0?t.success:t.muted}}>AED {fmt(amount)}</div>
    </div>
  );}

  return(<div style={{maxWidth:860}}>
    <Card title="Commission Calculator" t={t} style={{marginBottom:14}}>

      {/* Selector row */}
      <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:16,marginBottom:16}}>
        <div><label style={{fontSize:12,fontWeight:600,color:t.muted,display:'block',marginBottom:6}}>Executive</label>
          <select value={sel} onChange={e=>setSel(e.target.value)} style={ii}>
            <option value="">Select executive…</option>
            {execList.map(n=><option key={n} value={n}>{n}</option>)}
          </select>
        </div>
        <div style={{display:'flex',gap:8}}>
          <div style={{flex:1}}><label style={{fontSize:12,fontWeight:600,color:t.muted,display:'block',marginBottom:6}}>Year</label>
            <select value={year} onChange={e=>setYear(parseInt(e.target.value))} style={ii}>
              {[2022,2023,2024,2025,2026].map(y=><option key={y} value={y}>{y}</option>)}
            </select>
          </div>
          <div style={{flex:1}}><label style={{fontSize:12,fontWeight:600,color:t.muted,display:'block',marginBottom:6}}>Quarter</label>
            <select value={qtr} onChange={e=>setQtr(e.target.value)} style={ii}>
              {['Q1','Q2','Q3','Q4'].map(q=><option key={q}>{q}</option>)}
            </select>
          </div>
        </div>
      </div>

      {/* Info bar */}
      {sel&&<div style={{background:t.surface,borderRadius:8,padding:'10px 14px',marginBottom:12,fontSize:13,display:'flex',gap:16,flexWrap:'wrap'}}>
        <span><strong>{sel}</strong></span>
        <span style={{color:t.muted}}>Role: <strong style={{color:role?t.text:t.danger}}>{role||'⚠️ Not set'}</strong></span>
        <span style={{color:t.muted}}>Branch: {info.Branch||'—'}</span>
        <span style={{color:t.muted}}>Team: {info.Team||'—'}</span>
        <span style={{color:t.muted}}>Salary: <strong style={{color:t.text}}>AED {fmt(salary)}/mo</strong></span>
      </div>}
      {debugMsg&&<div style={{background:'#fef3c7',border:'1px solid #fcd34d',borderRadius:8,padding:'10px 14px',marginBottom:12,fontSize:12,color:'#92400e'}}>{debugMsg}</div>}

      {/* Target summary */}
      {sel&&annTarget>0&&<div style={{display:'grid',gridTemplateColumns:'repeat(3,1fr)',gap:10,marginBottom:14}}>
        {[
          ['Annual Target',`AED ${fmt(annTarget)}`,t.muted],
          [`${qtr} Total Target`,`AED ${fmt(qTotalTgt)}`,t.text],
          [`${qtr} Sales Target`,`AED ${fmt(qSalesTgt)}`,t.accent],
          [`${qtr} Renewal Target`,`AED ${fmt(qRenewTgt)}`,'#10b981'],
          [`Sales Collected`,`AED ${fmt(ns)}`,ns>=qSalesTgt&&qSalesTgt>0?t.success:t.text],
          [`Renewals Collected`,`AED ${fmt(rn)}`,rn>=qRenewTgt&&qRenewTgt>0?t.success:t.text],
        ].map(([lbl,val,col])=>(
          <div key={lbl} style={{background:t.surface,borderRadius:8,padding:'8px 12px'}}>
            <div style={{fontSize:10,color:t.muted,marginBottom:3}}>{lbl}</div>
