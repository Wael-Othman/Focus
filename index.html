/* ── Commission Code Editor ── */
function CommissionCodeEditor({t,dark}){
  const[code,setCode]=useState('');
  const[prompt,setPrompt]=useState('');
  const[loading,setLoading]=useState(false);
  const[msg,setMsg]=useState('');
  const ii={background:t.surface,border:`1px solid ${t.border}`,borderRadius:8,padding:'8px 12px',fontSize:12,color:t.text,fontFamily:"'DM Mono',monospace",width:'100%'};

  useEffect(()=>{
    // Extract current commission logic from the live page source
    const src=(document.querySelector('script[type="text/babel"]')||{}).textContent||'';
    const start=src.indexOf('/*COMMISSION_LOGIC_START*/');
    const end=src.indexOf('/*COMMISSION_LOGIC_END*/');
    if(start>-1&&end>-1)setCode(src.slice(start+25,end).trim());
    else setCode('// Could not extract — paste your commission logic here');
  },[]);

  const applyCode=()=>{
    // Replace the commission logic block in the page's script tag and trigger re-save
    try{
      const script=document.querySelector('script[type="text/babel"]');
      if(!script){setMsg('❌ Could not find script tag');return;}
      const src=script.textContent;
      const s=src.indexOf('/*COMMISSION_LOGIC_START*/');
      const e=src.indexOf('/*COMMISSION_LOGIC_END*/');
      if(s<0||e<0){setMsg('❌ Markers not found');return;}
      const newSrc=src.slice(0,s+25)+'\n'+code+'\n  '+src.slice(e);
      script.textContent=newSrc;
      // Trigger download of updated HTML
      const html=document.documentElement.outerHTML;
      const blob=new Blob([html],{type:'text/html'});
      const a=document.createElement('a');
      a.href=URL.createObjectURL(blob);
      a.download='Focus_Dashboard_updated.html';
      a.click();
      setMsg('✅ Updated HTML downloaded — replace your current file with it');
    }catch(e){setMsg('❌ '+e.message);}
  };

  return(<div>
    <div style={{marginBottom:10}}>
      <label style={{fontSize:11,fontWeight:600,color:t.muted,display:'block',marginBottom:6}}>Current commission logic (editable):</label>
      <textarea value={code} onChange={e=>setCode(e.target.value)}
        style={{...ii,height:300,resize:'vertical',lineHeight:1.5}}/>
    </div>
    {msg&&<div style={{fontSize:12,color:msg.startsWith('✅')?t.success:t.danger,marginBottom:10,padding:'8px 12px',background:t.surface,borderRadius:8}}>{msg}</div>}
    <div style={{display:'flex',gap:10,flexWrap:'wrap'}}>
      <Btn t={t} onClick={applyCode} style={{background:t.accent,color:'#fff',borderColor:t.accent}}>
        💾 Apply & Download Updated File
      </Btn>
    </div>
  </div>);
}

/* ── Pipeline Tab ── */
function PipelineTab({s3,sheets,t,dark}){
  const tt={background:t.card,border:`1px solid ${t.border}`,borderRadius:8,fontSize:12};

  // Build filter options from s3 and sheet4
  const s4map=useMemo(()=>{const m={};sheets.s4.forEach(r=>{if(r.Name)m[r.Name.trim()]=r;});return m;},[sheets.s4]);
  const opts=useMemo(()=>({
    regions:[...new Set(s3.map(r=>r.Region||r.Branch).filter(Boolean))].sort(),
    branches:[...new Set(s3.map(r=>r.Branch).filter(Boolean))].sort(),
    teams:[...new Set(s3.map(r=>r.Team||(r.Executive&&s4map[r.Executive.trim()]&&s4map[r.Executive.trim()].Team)).filter(Boolean))].sort(),
    execs:[...new Set(s3.map(r=>r.Executive).filter(Boolean))].sort(),
    months:MONTHS.filter(m=>s3.some(r=>r.Month===m)),
  }),[s3,s4map]);

  const[fRegion,setFRegion]=useState([]);const[fBranch,setFBranch]=useState([]);
  const[fTeam,setFTeam]=useState([]);const[fExec,setFExec]=useState([]);const[fMonth,setFMonth]=useState([]);

  const filtered=useMemo(()=>s3.filter(r=>{
    if(fRegion.length&&!fRegion.includes(r.Region||r.Branch))return false;
    if(fBranch.length&&!fBranch.includes(r.Branch))return false;
    const team=r.Team||(r.Executive&&s4map[r.Executive.trim()]&&s4map[r.Executive.trim()].Team);
    if(fTeam.length&&!fTeam.includes(team))return false;
    if(fExec.length&&!fExec.includes(r.Executive))return false;
    if(fMonth.length&&!fMonth.includes(r.Month))return false;
    return true;
  }),[s3,fRegion,fBranch,fTeam,fExec,fMonth,s4map]);

  const activeFC=[fRegion,fBranch,fTeam,fExec,fMonth].reduce((s,a)=>s+a.length,0);
  const clearAll=()=>{setFRegion([]);setFBranch([]);setFTeam([]);setFExec([]);setFMonth([]);};
  const tog=(arr,setArr,v)=>setArr(a=>a.includes(v)?a.filter(x=>x!==v):[...a,v]);

  const pipeline=useMemo(()=>{
    let as=0,un=0;const byExec={};
    filtered.forEach(r=>{const a=parseAmt(r['Collection Amount']);const ex=r.Executive||'Unknown';if(!byExec[ex])byExec[ex]={name:ex,assured:0,unassured:0,rows:0};if(HIGH_CONF.has(r['Collection Type'])){as+=a;byExec[ex].assured+=a;}if(LOW_CONF.has(r['Collection Type'])){un+=a;byExec[ex].unassured+=a;}byExec[ex].rows++;});
    return{assured:as,unassured:un,total:as+un,byExec:Object.values(byExec).sort((a,b)=>(b.assured+b.unassured)-(a.assured+a.unassured))};
  },[filtered]);

  const byMonth=useMemo(()=>{const m={};filtered.forEach(r=>{const k=r.Month||'?';if(!m[k])m[k]={month:k,assured:0,unassured:0};const a=parseAmt(r['Collection Amount']);if(HIGH_CONF.has(r['Collection Type']))m[k].assured+=a;if(LOW_CONF.has(r['Collection Type']))m[k].unassured+=a;});return MONTHS.filter(mo=>m[mo]).map(mo=>m[mo]);},[filtered]);
  const byStage=useMemo(()=>{const m={};filtered.forEach(r=>{const k=r.Stage||'Unknown';m[k]=(m[k]||0)+parseAmt(r['Collection Amount']);});return Object.entries(m).sort((a,b)=>b[1]-a[1]).map(([name,value])=>({name,value}));},[filtered]);

  // AI prompt
  const aiPrompt=useMemo(()=>{
    const topExecs=pipeline.byExec.slice(0,5).map(e=>`${e.name}: Assured AED ${fmt(e.assured)}, Unassured AED ${e.unassured}`).join('; ');
    return `You are a sales analytics assistant. Analyse this pipeline data and give 4-5 actionable bullet-point insights:\n- Total Assured Pipeline: AED ${fmt(pipeline.assured)}\n- Total Unassured Pipeline: AED ${fmt(pipeline.unassured)}\n- Confidence Rate: ${fmtP(pct(pipeline.assured,pipeline.total||1))}\n- Top executives: ${topExecs}\n- Active filters: ${activeFC>0?[...fRegion,...fBranch,...fTeam,...fExec].join(', '):'None (full pipeline)'}\nFocus on risks, opportunities, and what sales managers should act on this week.`;
  },[pipeline,activeFC,fRegion,fBranch,fTeam,fExec]);

  if(!s3.length)return(<div style={{textAlign:'center',padding:80,color:t.muted}}><div style={{fontSize:48,marginBottom:16}}>🔭</div><div style={{fontSize:18,fontWeight:600,color:t.text,marginBottom:8}}>No pipeline data</div><div>Upload Sheet 3 in Settings.</div></div>);

  return(<div style={{display:'flex',gap:16}}>
    {/* Filter sidebar */}
    <div style={{width:190,flexShrink:0}}>
      <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:8}}>
        <span style={{fontSize:11,fontWeight:700,color:t.muted,textTransform:'uppercase',letterSpacing:'.6px'}}>Filter Pipeline</span>
        {activeFC>0&&<Btn t={t} onClick={clearAll} style={{padding:'2px 7px',fontSize:11}}>Clear</Btn>}
      </div>
      {opts.regions.length>0&&<FG label="Region" t={t}>{opts.regions.map(v=><Chip key={v} label={v} active={fRegion.includes(v)} onClick={()=>tog(fRegion,setFRegion,v)} t={t}/>)}</FG>}
      {opts.branches.length>0&&<FG label="Branch" t={t}>{opts.branches.map(v=><Chip key={v} label={v} active={fBranch.includes(v)} onClick={()=>tog(fBranch,setFBranch,v)} t={t}/>)}</FG>}
      {opts.teams.length>0&&<FG label="Team" t={t}>{opts.teams.map(v=><Chip key={v} label={v} active={fTeam.includes(v)} onClick={()=>tog(fTeam,setFTeam,v)} t={t}/>)}</FG>}
      {opts.months.length>0&&<FG label="Month" t={t}>{opts.months.map(v=><Chip key={v} label={v} active={fMonth.includes(v)} onClick={()=>tog(fMonth,setFMonth,v)} t={t}/>)}</FG>}
      {opts.execs.length>0&&<FG label="Executive" t={t}>{opts.execs.map(v=><Chip key={v} label={v} active={fExec.includes(v)} onClick={()=>tog(fExec,setFExec,v)} t={t}/>)}</FG>}
    </div>

    {/* Main content */}
    <div style={{flex:1,minWidth:0}}>
      <div style={{display:'grid',gridTemplateColumns:'repeat(4,1fr)',gap:14,marginBottom:16}}>
        <KPI label="Assured Pipeline" value={`AED ${fmt(pipeline.assured)}`} sub="High confidence" t={t}/>
        <KPI label="Unassured Pipeline" value={`AED ${fmt(pipeline.unassured)}`} sub="Low confidence" t={t}/>
        <KPI label="Total Pipeline" value={`AED ${fmt(pipeline.total)}`} t={t}/>
        <KPI label="Confidence Rate" value={fmtP(pct(pipeline.assured,pipeline.total||1))} ac={pct(pipeline.assured,pipeline.total||1)>=70?t.success:t.warning} t={t}/>
      </div>
      <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:14,marginBottom:14}}>
        <ChartCard title="Pipeline by Month" chartId="pipeline_month" data={byMonth} keys={[{key:'assured',name:'Assured',color:'#10b981'},{key:'unassured',name:'Unassured',color:'#f59e0b'}]} nameKey="month" height={220} defaultType="bar" t={t}/>
        <ChartCard title="Pipeline by Stage" chartId="pipeline_stage" data={byStage} keys={[{key:'value',name:'Amount',color:t.accent}]} height={220} defaultType="funnel" t={t}/>
      </div>
      <Card title="Pipeline by Executive" t={t} style={{marginBottom:14}}>
        <div style={{overflowX:'auto'}}><table style={{width:'100%',borderCollapse:'collapse'}}>
          <thead><tr>{['Executive','Assured','Unassured','Total','Confidence'].map(l=><TH key={l} t={t}>{l}</TH>)}</tr></thead>
          <tbody>{pipeline.byExec.map((e,i)=>{const tot=e.assured+e.unassured;const conf=tot?pct(e.assured,tot):0;return(<tr key={i}><TD t={t}>{e.name}</TD><TD t={t} mono color={t.success}>AED {fmt(e.assured)}</TD><TD t={t} mono color={t.warning}>AED {fmt(e.unassured)}</TD><TD t={t} mono bold>AED {fmt(tot)}</TD><TD t={t}><div style={{display:'flex',alignItems:'center',gap:8}}><div style={{background:t.surface,borderRadius:4,height:5,width:80}}><div style={{height:5,borderRadius:4,background:conf>70?'#10b981':'#f59e0b',width:`${conf}%`}}/></div><span style={{fontSize:11}}>{conf.toFixed(0)}%</span></div></TD></tr>);})}</tbody>
        </table></div>
      </Card>
      <AIInsights prompt={aiPrompt} t={t} label="AI Pipeline Insights"/>
      <PipelineRawSheet s3={filtered} t={t}/>
    </div>
  </div>);
}

/* ── Pipeline Raw Data Sheet ── */
function PipelineRawSheet({s3,t}){
  const[search,setSearch]=useState('');const[sortCol,setSortCol]=useState('');const[sortDir,setSortDir]=useState(1);
  const[page,setPage]=useState(0);const PAGE_SIZE=50;

  const headers=useMemo(()=>{
    if(!s3.length)return[];
    const all=new Set();s3.forEach(r=>Object.keys(r).forEach(k=>all.add(k)));
    return [...all];
  },[s3]);

  const filtered=useMemo(()=>{
    let rows=s3.filter(r=>!search||Object.values(r).some(v=>(v||'').toLowerCase().includes(search.toLowerCase())));
    if(sortCol){rows=[...rows].sort((a,b)=>{const av=a[sortCol]||'';const bv=b[sortCol]||'';const an=parseFloat(av.replace(/[^0-9.-]/g,''));const bn=parseFloat(bv.replace(/[^0-9.-]/g,''));if(!isNaN(an)&&!isNaN(bn))return(an-bn)*sortDir;return av.localeCompare(bv)*sortDir;});}
    return rows;
  },[s3,search,sortCol,sortDir]);

  const pageRows=filtered.slice(page*PAGE_SIZE,(page+1)*PAGE_SIZE);
  const totalPages=Math.ceil(filtered.length/PAGE_SIZE);

  const sort=(col)=>{if(sortCol===col)setSortDir(d=>-d);else{setSortCol(col);setSortDir(1);}setPage(0);};

  const exportCSV=()=>{
    const rows=[headers.join(','),...s3.map(r=>headers.map(h=>`"${(r[h]||'').replace(/"/g,'""')}"`).join(','))];
    const blob=new Blob([rows.join('\n')],{type:'text/csv'});
    const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='pipeline_data.csv';a.click();
  };

  if(!s3.length)return null;

  return(
    <div style={{marginTop:16}}>
      <Card title={`Raw Pipeline Data — ${s3.length} rows`} t={t} action={<Btn t={t} onClick={exportCSV} style={{fontSize:11,padding:'4px 10px'}}>⬇ Export CSV</Btn>}>
        {/* Search */}
        <div style={{marginBottom:12,display:'flex',gap:10,alignItems:'center',flexWrap:'wrap'}}>
          <input value={search} onChange={e=>{setSearch(e.target.value);setPage(0);}} placeholder="Search across all columns..." style={{background:t.surface,border:`1px solid ${t.border}`,borderRadius:8,padding:'7px 12px',fontSize:13,color:t.text,flex:1,minWidth:200}}/>
          {search&&<span style={{fontSize:12,color:t.muted}}>{filtered.length} of {s3.length} rows</span>}
          <span style={{fontSize:12,color:t.muted}}>Page {page+1}/{totalPages}</span>
          <div style={{display:'flex',gap:4}}>
            <Btn t={t} disabled={page===0} onClick={()=>setPage(p=>p-1)} style={{padding:'4px 10px',fontSize:12}}>‹</Btn>
            <Btn t={t} disabled={page>=totalPages-1} onClick={()=>setPage(p=>p+1)} style={{padding:'4px 10px',fontSize:12}}>›</Btn>
          </div>
        </div>
        {/* Table */}
        <div style={{overflowX:'auto',overflowY:'auto',maxHeight:520,border:`1px solid ${t.border}`,borderRadius:8}}>
          <table style={{borderCollapse:'collapse',fontSize:12,minWidth:'100%'}}>
            <thead style={{position:'sticky',top:0,zIndex:10}}>
              <tr style={{background:t.card}}>
                {headers.map(h=>(
                  <th key={h} onClick={()=>sort(h)} style={{padding:'8px 10px',borderBottom:`2px solid ${t.border}`,textAlign:'left',fontWeight:700,color:t.muted,textTransform:'uppercase',letterSpacing:'.4px',fontSize:10,cursor:'pointer',whiteSpace:'nowrap',userSelect:'none',background:t.card}}>
                    {h} {sortCol===h?(sortDir===1?'▲':'▼'):''}
                  </th>
                ))}
              </tr>
            </thead>
            <tbody>
              {pageRows.map((row,i)=>(
                <tr key={i} style={{background:i%2===0?t.card:t.surface}}>
                  {headers.map(h=>{
                    const v=row[h]||'';
                    const isAmt=h.toLowerCase().includes('amount')||h.toLowerCase().includes('collection');
                    const num=isAmt?parseAmt(v):0;
                    return(
                      <td key={h} style={{padding:'6px 10px',borderBottom:`1px solid ${t.border}`,whiteSpace:'nowrap',color:isAmt&&num>0?t.success:t.text,fontFamily:isAmt?"'DM Mono',monospace":undefined,maxWidth:220,overflow:'hidden',textOverflow:'ellipsis'}}
                        title={v}>
                        {isAmt&&num>0?`AED ${fmt(num)}`:v}
                      </td>
                    );
                  })}
                </tr>
              ))}
            </tbody>
          </table>
        </div>
        <div style={{marginTop:8,fontSize:11,color:t.muted,display:'flex',justifyContent:'space-between'}}>
          <span>Showing rows {page*PAGE_SIZE+1}–{Math.min((page+1)*PAGE_SIZE,filtered.length)} of {filtered.length}</span>
          <span>Click any column header to sort</span>
        </div>
      </Card>
    </div>
  );
}

/* ── Performance Tab ── */
function PerformanceTab({allTx,targets,sheets,t}){
  const[selYear,setSelYear]=useState(new Date().getFullYear());
  const[selQtr,setSelQtr]=useState('Q1');
  const[view,setView]=useState('monthly');
  const[compareView,setCompareView]=useState('branch');
  const[treeLevel,setTreeLevel]=useState('branch'); // 'branch' | 'team' | 'employee'
  const[expanded,setExpanded]=useState({}); // {key: true} map
  const[fMonth,setFMonth]=useState([]);
  const[fTeam,setFTeam]=useState([]);
  const[fBranch,setFBranch]=useState([]);
  const inp={background:t.surface,border:`1px solid ${t.border}`,borderRadius:8,padding:'7px 10px',fontSize:13,color:t.text,fontFamily:"'DM Sans',sans-serif"};

  const availYears=useMemo(()=>[...new Set(allTx.map(r=>r._year).filter(Boolean))].sort((a,b)=>b-a),[allTx]);

  const s2FilterOpts=useMemo(()=>{
    const yearTx=allTx.filter(r=>String(r._year)===String(selYear));
    return{
      months:MONTHS.filter(m=>yearTx.some(r=>r.Month===m)),
      teams:[...new Set(yearTx.map(r=>r.Team).filter(Boolean))].sort(),
      branches:[...new Set(yearTx.map(r=>r.Branch).filter(Boolean))].sort(),
    };
  },[allTx,selYear]);

  useEffect(()=>{setFMonth([]);setFTeam([]);setFBranch([]);setExpanded({});},[selYear]);
  useEffect(()=>{setExpanded({});},[treeLevel]);

  const tog=(arr,setArr,v)=>setArr(a=>a.includes(v)?a.filter(x=>x!==v):[...a,v]);
  const activeFC=fMonth.length+fTeam.length+fBranch.length;

  const toggleExpand=(key)=>setExpanded(prev=>{const n={...prev};n[key]?delete n[key]:n[key]=true;return n;});

  // ── Monthly data (unchanged) ──────────────────────────────────────────────
  const monthlyData=useMemo(()=>{
    const byYM={};
    const txForMonthly=allTx.filter(r=>{
      if(fTeam.length&&!fTeam.includes(r.Team))return false;
      if(fBranch.length&&!fBranch.includes(r.Branch))return false;
      return true;
    });
    txForMonthly.forEach(r=>{if(!r._year||!r.Month)return;const y=String(r._year);if(!byYM[y])byYM[y]={};byYM[y][r.Month]=(byYM[y][r.Month]||0)+r._amount;});
    const dataYears=[...new Set(txForMonthly.map(r=>String(r._year)).filter(v=>v&&v!=='null'))].sort();
    const curYr=String(selYear);const prevYr=String(selYear-1);
    const rows=[];
    ['Q1','Q2','Q3','Q4'].forEach(q=>{
      const qT={};dataYears.forEach(y=>qT[y]=0);
      Q_MONTHS[q].forEach(mo=>{
        const row={month:mo,isMonth:true};
        dataYears.forEach(y=>{const v=(byYM[y]||{})[mo]||0;row[y]=v;qT[y]+=v;});
        row.d1=(row[curYr]||0)-(row[String(selYear-2)]||0);
        row.d2=(row[curYr]||0)-(row[prevYr]||0);
        rows.push(row);
      });
      const qRow={month:q,isMonth:false};
      dataYears.forEach(y=>qRow[y]=qT[y]);
      qRow.d1=(qT[curYr]||0)-(qT[String(selYear-2)]||0);
      qRow.d2=(qT[curYr]||0)-(qT[prevYr]||0);
      rows.push(qRow);
    });
    return{rows,dataYears};
  },[allTx,selYear,fTeam,fBranch]);

  // ── Build the full grouped structure (branch → team → employees) ──────────
  const groupedData=useMemo(()=>{
    const curYr=String(selYear);
    const qMos=Q_MONTHS[selQtr]||[];
    const qIdx=['Q1','Q2','Q3','Q4'].indexOf(selQtr);
    const ytdMos=[].concat(...['Q1','Q2','Q3','Q4'].slice(0,qIdx+1).map(q=>Q_MONTHS[q]));

    const baseTx=allTx.filter(r=>{
      if(String(r._year)!==curYr)return false;
      if(fTeam.length&&!fTeam.includes(r.Team))return false;
      if(fBranch.length&&!fBranch.includes(r.Branch))return false;
      return true;
    });
    const monthFilterActive=fMonth.length>0;
    const effectiveQMos=monthFilterActive?qMos.filter(m=>fMonth.includes(m)):qMos;
    const effectiveYtdMos=monthFilterActive?ytdMos.filter(m=>fMonth.includes(m)):ytdMos;

    const qtdByE={},ytdByE={},empTeam={},empBranch={};
    baseTx.forEach(r=>{
      const emp=r.Employee&&r.Employee.trim();if(!emp)return;
      if(effectiveQMos.includes(r.Month))qtdByE[emp]=(qtdByE[emp]||0)+r._amount;
      if(effectiveYtdMos.includes(r.Month))ytdByE[emp]=(ytdByE[emp]||0)+r._amount;
      if(r.Team&&!empTeam[emp])empTeam[emp]=r.Team;
      if(r.Branch&&!empBranch[emp])empBranch[emp]=r.Branch;
    });

    const allEmps=new Set([...Object.keys(qtdByE),...Object.keys(ytdByE)]);
    const org3=buildOrg(sheets.s4);
    const s4people={};org3.list.forEach(p=>{s4people[p.name]=p;});

    // grouped[branch][team] = [employees]
    const grouped={};
    allEmps.forEach(empName=>{
      const s4p=s4people[empName];
      const team=empTeam[empName]||(s4p&&s4p.teams&&s4p.teams[0])||'Unassigned';
      const branch=empBranch[empName]||(s4p&&s4p.branches&&s4p.branches[0])||'Unassigned';
      const role=(s4p&&s4p.role)||'Executive';
      if(!grouped[branch])grouped[branch]={};
      if(!grouped[branch][team])grouped[branch][team]=[];
      const ytd=ytdByE[empName]||0;
      const at=parseFloat(targets[`target_${empName}_${selYear}`]||0);
      const qt=at*(Q_WEIGHTS[selQtr]||0.25);
      const v=ytd-qt;
      const aq=qt?pct(ytd,qt):0;
      const aa=at?pct(ytd,at):0;
      const st=aq>=100?'On Track':aq>=75?'At Risk':'Behind';
      grouped[branch][team].push({name:empName,role,team,branch,ytd,at,qt,v,aq,aa,st});
    });

    // Pre-aggregate teams and branches
    const branchMap={};
    Object.keys(grouped).sort().forEach(branch=>{
      let bYtd=0,bAt=0,bQt=0;
      const teamMap={};
      Object.keys(grouped[branch]).sort().forEach(team=>{
        const members=grouped[branch][team].sort((a,b)=>b.ytd-a.ytd);
        let tYtd=0,tAt=0,tQt=0;
        members.forEach(m=>{tYtd+=m.ytd;tAt+=m.at;tQt+=m.qt;});
        bYtd+=tYtd;bAt+=tAt;bQt+=tQt;
        teamMap[team]={ytd:tYtd,at:tAt,qt:tQt,v:tYtd-tQt,aq:tQt?pct(tYtd,tQt):0,aa:tAt?pct(tYtd,tAt):0,members};
      });
      branchMap[branch]={ytd:bYtd,at:bAt,qt:bQt,v:bYtd-bQt,aq:bQt?pct(bYtd,bQt):0,aa:bAt?pct(bYtd,bAt):0,teams:teamMap};
    });
    return branchMap;
  },[allTx,selYear,selQtr,fMonth,fTeam,fBranch,sheets.s4,targets]);

  // ── Build visible rows based on treeLevel and expanded state ─────────────
  const treeRows=useMemo(()=>{
    const rows=[];
    Object.keys(groupedData).sort().forEach(branch=>{
      const bd=groupedData[branch];
      rows.push({
        key:`b:${branch}`,label:branch,icon:'🏢',level:0,
        isHeader:true,nodeType:'branch',
        ytd:bd.ytd,at:bd.at,qt:bd.qt,v:bd.v,aq:bd.aq,aa:bd.aa,
        hasChildren:true,childCount:Object.keys(bd.teams).length,
      });
      if(treeLevel==='branch')return; // branch-only view: no children

      // Show teams if level is 'team' or 'employee', or if branch is expanded
      const showTeams=treeLevel==='team'||treeLevel==='employee'||expanded[`b:${branch}`];
      if(!showTeams)return;

      Object.keys(bd.teams).sort().forEach(team=>{
        const td=bd.teams[team];
        rows.push({
          key:`t:${branch}:${team}`,label:team,icon:'👥',level:1,
          isHeader:true,nodeType:'team',
          ytd:td.ytd,at:td.at,qt:td.qt,v:td.v,aq:td.aq,aa:td.aa,
          hasChildren:true,childCount:td.members.length,branch,
        });
        if(treeLevel==='team')return; // team-level view: no employees

        // Show employees if level is 'employee', or if team is expanded
        const showEmps=treeLevel==='employee'||expanded[`t:${branch}:${team}`];
        if(!showEmps)return;

        td.members.forEach(m=>{
          rows.push({
            key:`e:${m.name}`,label:m.name,icon:'',level:2,
            isHeader:false,nodeType:'employee',role:m.role,
            ytd:m.ytd,at:m.at,qt:m.qt,v:m.v,aq:m.aq,aa:m.aa,st:m.st,
          });
        });
      });
    });
    return rows;
  },[groupedData,treeLevel,expanded]);

  // ── Year comparison ───────────────────────────────────────────────────────
  const compareData=useMemo(()=>{
    const dataYears=[...new Set(allTx.map(r=>String(r._year)).filter(v=>v&&v!=='null'))].sort().slice(-5);
    let keys=[];
    if(compareView==='branch')keys=[...new Set(allTx.map(r=>r.Branch).filter(Boolean))].sort();
    else if(compareView==='team')keys=[...new Set(allTx.map(r=>r.Team).filter(Boolean))].sort();
    else keys=[...new Set(allTx.map(r=>r.Employee).filter(Boolean))].sort().slice(0,20);
    const rows=keys.map(k=>{const row={name:k};dataYears.forEach(y=>{row[y]=allTx.filter(r=>String(r._year)===y&&(compareView==='branch'?r.Branch:compareView==='team'?r.Team:r.Employee)===k).reduce((s,r)=>s+r._amount,0);});return row;});
    return{rows,dataYears};
  },[allTx,compareView]);

  const{rows,dataYears}=monthlyData;
  const curYr=String(selYear);
  const visY=dataYears.filter(y=>parseInt(y)<=selYear).slice(-5);
  const sb=s=>{if(s==='On Track')return <Badge text={s} type="green"/>;if(s==='At Risk')return <Badge text={s} type="amber"/>;if(s==='Behind')return <Badge text={s} type="red"/>;return null;};

  // ── Render ────────────────────────────────────────────────────────────────
  return(<div>
    {/* Top controls */}
    <div style={{display:'flex',gap:10,marginBottom:16,flexWrap:'wrap',alignItems:'center'}}>
      <div style={{display:'flex',background:t.surface,border:`1px solid ${t.border}`,borderRadius:8,overflow:'hidden'}}>
        {[['monthly','📅 Monthly'],['employee','👤 Performance'],['compare','📊 Year Comparison'],['org','🌳 Org View']].map(([v,l])=>(
          <button key={v} onClick={()=>setView(v)} style={{padding:'7px 14px',fontSize:12,fontWeight:600,border:'none',cursor:'pointer',background:view===v?t.accent:'transparent',color:view===v?'#fff':t.muted,fontFamily:"'DM Sans',sans-serif"}}>{l}</button>
        ))}
      </div>
      <select value={selYear} onChange={e=>setSelYear(parseInt(e.target.value))} style={inp}>
        {(availYears.length?availYears:[2021,2022,2023,2024,2025,2026]).map(y=><option key={y} value={y}>{y}</option>)}
      </select>
      {view==='employee'&&<select value={selQtr} onChange={e=>setSelQtr(e.target.value)} style={inp}>
        {['Q1','Q2','Q3','Q4'].map(q=><option key={q}>{q}</option>)}
      </select>}
      {view==='compare'&&<select value={compareView} onChange={e=>setCompareView(e.target.value)} style={inp}>
        <option value="branch">By Branch</option><option value="team">By Team</option><option value="individual">By Individual</option>
      </select>}
    </div>

    {/* ── PERFORMANCE TREE VIEW ─────────────────────────────────────────── */}
    {view==='employee'&&<div style={{display:'flex',gap:16}}>
      {/* Left sidebar: filters */}
      <div style={{width:175,flexShrink:0}}>
        {/* Level selector */}
        <div style={{marginBottom:14}}>
          <div style={{fontSize:11,fontWeight:700,color:t.muted,textTransform:'uppercase',letterSpacing:'.6px',marginBottom:8}}>View Level</div>
          <div style={{display:'flex',flexDirection:'column',gap:4}}>
            {[['branch','🏢 Branch'],['team','👥 Team'],['employee','👤 Employee']].map(([v,l])=>(
              <button key={v} onClick={()=>setTreeLevel(v)} style={{
                padding:'7px 10px',fontSize:12,fontWeight:600,border:`1px solid ${treeLevel===v?t.accent:t.border}`,
                borderRadius:7,cursor:'pointer',textAlign:'left',
                background:treeLevel===v?t.accent+'18':'transparent',
                color:treeLevel===v?t.accent:t.muted,fontFamily:"'DM Sans',sans-serif",
              }}>{l}</button>
            ))}
          </div>
        </div>
        {/* Filters */}
        <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:8}}>
          <span style={{fontSize:11,fontWeight:700,color:t.muted,textTransform:'uppercase',letterSpacing:'.6px'}}>Filters</span>
          {activeFC>0&&<Btn t={t} onClick={()=>{setFMonth([]);setFTeam([]);setFBranch([]);}} style={{padding:'2px 7px',fontSize:11}}>Clear</Btn>}
        </div>
        {s2FilterOpts.branches.length>0&&<FG label="Branch" t={t}>{s2FilterOpts.branches.map(v=><Chip key={v} label={v} active={fBranch.includes(v)} onClick={()=>tog(fBranch,setFBranch,v)} t={t}/>)}</FG>}
        {s2FilterOpts.teams.length>0&&<FG label="Team" t={t}>{s2FilterOpts.teams.map(v=><Chip key={v} label={v} active={fTeam.includes(v)} onClick={()=>tog(fTeam,setFTeam,v)} t={t}/>)}</FG>}
        {s2FilterOpts.months.length>0&&<FG label="Month" t={t}>{s2FilterOpts.months.map(v=><Chip key={v} label={v} active={fMonth.includes(v)} onClick={()=>tog(fMonth,setFMonth,v)} t={t}/>)}</FG>}
      </div>

      {/* Right: tree table */}
      <div style={{flex:1,minWidth:0}}>
        <Card title={`Performance — ${selQtr} ${selYear} · ${treeLevel==='branch'?'Branch View':treeLevel==='team'?'Team View':'Employee View'}${activeFC>0?' (filtered)':''}`} t={t}>

          {/* Level hint */}
          <div style={{fontSize:12,color:t.muted,marginBottom:12,lineHeight:1.5}}>
            {treeLevel==='branch'&&'Showing all branches. Click 🏢 to expand a branch and see its teams.'}
            {treeLevel==='team'&&'Showing all teams under each branch. Click 👥 to expand a team and see its employees.'}
            {treeLevel==='employee'&&'Showing full tree: branches → teams → employees.'}
          </div>

          <div style={{overflowX:'auto'}}><table style={{width:'100%',borderCollapse:'collapse'}}>
            <thead><tr>
              <TH t={t}>Name</TH>
              <TH t={t} right>Collected</TH>
              <TH t={t} right>Target</TH>
              <TH t={t} right>{selQtr} Target</TH>
              <TH t={t} right>Variance</TH>
              <TH t={t} right>Attainment %</TH>
              <TH t={t} right>Annual %</TH>
              <TH t={t}>Status</TH>
            </tr></thead>
            <tbody>
            {treeRows.map(row=>{
              const canExpand=row.hasChildren&&treeLevel!=='employee'&&(
                (treeLevel==='branch'&&row.nodeType==='branch')||
                (treeLevel==='team'&&row.nodeType==='team')
              );
              const isExpanded=!!expanded[row.key];
              const indent=row.level*22;
              const isBranch=row.nodeType==='branch';
              const isTeam=row.nodeType==='team';
              const isEmp=row.nodeType==='employee';
              return(
                <tr key={row.key} style={{
                  background:isBranch?t.accent+'15':isTeam?t.surface:'transparent',
                  borderBottom:isBranch?`2px solid ${t.accent}33`:`1px solid ${t.border}`,
                }}>
                  <TD t={t} style={{paddingLeft:10+indent,fontWeight:isBranch?700:isTeam?600:400}}>
                    <div style={{display:'flex',alignItems:'center',gap:6}}>
                      {/* Expand/collapse toggle */}
                      {canExpand?(
                        <button onClick={()=>toggleExpand(row.key)} style={{
                          background:'none',border:'none',cursor:'pointer',fontSize:11,
                          color:t.muted,padding:'0 2px',lineHeight:1,flexShrink:0,
                          transform:isExpanded?'rotate(90deg)':'rotate(0deg)',transition:'transform .15s',
                        }}>▶</button>
                      ):(
                        // spacer to keep alignment
                        <span style={{display:'inline-block',width:16,flexShrink:0}}/>
                      )}
                      <span style={{fontSize:14,flexShrink:0}}>{row.icon}</span>
                      <span style={{color:isBranch?t.accent:t.text}}>{row.label}</span>
                      {isEmp&&row.role&&<span style={{fontSize:10,color:t.muted,marginLeft:4}}>{row.role}</span>}
                      {(isBranch||isTeam)&&<span style={{fontSize:10,color:t.muted,marginLeft:4}}>({row.childCount})</span>}
                    </div>
                  </TD>
                  <TD t={t} mono right bold={isBranch||isTeam} style={{color:isBranch?t.accent:t.text}}>{fmt(row.ytd)}</TD>
                  <TD t={t} mono right color={t.muted}>{row.at>0?fmt(row.at):'—'}</TD>
                  <TD t={t} mono right color={t.muted}>{row.qt>0?fmt(row.qt):'—'}</TD>
                  <TD t={t} mono right bold={isBranch||isTeam} style={{color:row.qt>0?(row.v>=0?t.success:t.danger):t.muted}}>{row.qt>0?((row.v>=0?'+':'')+fmt(row.v)):'—'}</TD>
                  <TD t={t} mono right bold={isBranch||isTeam} style={{color:row.aq>=100?t.success:row.aq>=75?t.warning:t.danger}}>{row.qt>0?fmtP(row.aq):'—'}</TD>
                  <TD t={t} mono right color={t.muted}>{row.at>0?fmtP(row.aa):'—'}</TD>
                  <TD t={t}>{isEmp&&sb(row.st)}</TD>
                </tr>
              );
            })}
            </tbody>
          </table></div>
          {treeRows.length===0&&<div style={{textAlign:'center',padding:32,color:t.muted,fontSize:13}}>No data for selected filters</div>}
        </Card>
      </div>
    </div>}

    {/* ── MONTHLY VIEW ──────────────────────────────────────────────────── */}
    {view==='monthly'&&<div style={{display:'flex',gap:16}}>
      <div style={{width:175,flexShrink:0}}>
        <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:8}}>
          <span style={{fontSize:11,fontWeight:700,color:t.muted,textTransform:'uppercase',letterSpacing:'.6px'}}>Filters</span>
          {activeFC>0&&<Btn t={t} onClick={()=>{setFMonth([]);setFTeam([]);setFBranch([]);}} style={{padding:'2px 7px',fontSize:11}}>Clear</Btn>}
        </div>
        {s2FilterOpts.branches.length>0&&<FG label="Branch" t={t}>{s2FilterOpts.branches.map(v=><Chip key={v} label={v} active={fBranch.includes(v)} onClick={()=>tog(fBranch,setFBranch,v)} t={t}/>)}</FG>}
        {s2FilterOpts.teams.length>0&&<FG label="Team" t={t}>{s2FilterOpts.teams.map(v=><Chip key={v} label={v} active={fTeam.includes(v)} onClick={()=>tog(fTeam,setFTeam,v)} t={t}/>)}</FG>}
      </div>
      <div style={{flex:1,minWidth:0}}>
      <Card title={`Monthly Collections — ${selYear} vs prior years${activeFC>0?' (filtered)':''}`} t={t}>
        <div style={{overflowX:'auto'}}><table style={{width:'100%',borderCollapse:'collapse',fontSize:12}}>
          <thead><tr><TH t={t}>Month</TH>{visY.map(y=><TH key={y} t={t} right>{y}</TH>)}<TH t={t} right>vs {selYear-2}</TH><TH t={t} right>vs {selYear-1}</TH></tr></thead>
          <tbody>
            {rows.map((row,i)=><tr key={i} style={{background:!row.isMonth?t.surface:'transparent',fontWeight:!row.isMonth?700:400}}>
              <TD t={t} style={{paddingLeft:row.isMonth?22:10,fontWeight:!row.isMonth?700:400,color:!row.isMonth?t.accent:t.text}}>{row.month}</TD>
              {visY.map(y=><TD key={y} t={t} mono right bold={!row.isMonth} style={{color:y===curYr?t.text:t.muted}}>{row[y]>0?fmt(row[y]):'—'}</TD>)}
              <TD t={t} mono right bold={!row.isMonth} style={{color:row[curYr]>0?(row.d1>=0?t.success:t.danger):t.muted}}>{row[curYr]>0?((row.d1>=0?'+':'')+fmt(row.d1)):'—'}</TD>
              <TD t={t} mono right bold={!row.isMonth} style={{color:row[curYr]>0?(row.d2>=0?t.success:t.danger):t.muted}}>{row[curYr]>0?((row.d2>=0?'+':'')+fmt(row.d2)):'—'}</TD>
            </tr>)}
            <tr style={{background:t.accent+'22',fontWeight:700}}>
              <TD t={t} bold style={{color:t.accent}}>TOTAL</TD>
              {visY.map(y=>{const tot=MONTHS.reduce((s,m)=>{const r=rows.find(r=>r.month===m&&r.isMonth);return s+(r?r[y]||0:0);},0);return <TD key={y} t={t} mono right bold style={{color:y===curYr?t.text:t.muted}}>{tot>0?fmt(tot):'—'}</TD>;})}
              <TD t={t}/><TD t={t}/>
            </tr>
          </tbody>
        </table></div>
        <div style={{display:'grid',gridTemplateColumns:'repeat(4,1fr)',gap:12,marginTop:16}}>
          {['Q1','Q2','Q3','Q4'].map(q=>{const qr=rows.find(r=>r.month===q&&!r.isMonth);const cur=qr?qr[curYr]||0:0;const prev=qr?qr[String(selYear-1)]||0:0;return(
            <div key={q} style={{background:t.surface,border:`1px solid ${t.border}`,borderRadius:10,padding:'12px 14px'}}>
              <div style={{fontSize:11,fontWeight:700,color:t.muted,marginBottom:6}}>{q} {selYear}</div>
              <div style={{fontSize:19,fontWeight:700,fontFamily:"'DM Mono',monospace",color:t.text,marginBottom:4}}>{cur>0?fmt(cur):'—'}</div>
              {prev>0&&<div style={{fontSize:11,color:(cur-prev)>=0?t.success:t.danger}}>{(cur-prev)>=0?'▲':'▼'} {fmt(Math.abs(cur-prev))} vs {selYear-1}</div>}
            </div>
          );})}
        </div>
      </Card>
      </div>

    {/* ── YEAR COMPARISON ───────────────────────────────────────────────── */}

    </Card>}

    {/* ── ORG VIEW ──────────────────────────────────────────────────────── */}
    {view==='org'&&(()=>{
      const org5=buildOrg(sheets.s4);
      const byBranch={};
      sheets.s4.filter(r=>r.Branch).forEach(r=>{
        const b=r.Branch;if(!byBranch[b])byBranch[b]={branch:b,region:r.Region||'',members:[]};
        if(r.Name&&!byBranch[b].members.find(m=>m.name===r.Name.trim())){
          byBranch[b].members.push({name:r.Name.trim(),role:r.Role||'',team:r.Team||'',reporting:r['Reporting to']||''});

          <Card key={b.branch} title={`${b.branch} — ${b.region}`} t={t}>

              <div key={i} style={{display:'flex',alignItems:'flex-start',gap:10,padding:'8px 0',borderBottom:`1px solid ${t.border}`}}>
                <div style={{width:32,height:32,borderRadius:'50%',background:isManager(m.role)?t.accent+'22':'#10b981'+'22',display:'flex',alignItems:'center',justifyContent:'center',fontSize:14,flexShrink:0}}>{isManager(m.role)?'👔':'👤'}</div>
                <div style={{flex:1,minWidth:0}}>
                  <div style={{fontSize:13,fontWeight:isManager(m.role)?600:400,color:t.text,overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}}>{m.name}</div>
                  <div style={{fontSize:11,color:t.muted}}>{m.role}{m.team?` · ${m.team}`:''}</div>
                  {m.reporting&&<div style={{fontSize:10,color:t.muted,marginTop:2}}>Reports to: {m.reporting}</div>}
                </div>
                <Badge text={m.role||'—'} type={isManager(m.role)?'purple':'green'}/>
              </div>
            ))}

    })()}

  </div>);
}

/* ── Overview Tab ── */
function OverviewTab({filtered,totalCollected,totalTx,uniqueCustomers,uniqueEmployees,monthlyTrend,byPtype,byRegion,leaderboard,topCustomers,retVsNew,concentration,t,allTx}){
  const maxC=(topCustomers[0]&&topCustomers[0].value)||1;const maxE=(leaderboard.execs[0]&&leaderboard.execs[0].amount)||1;
  const tt={background:t.card,border:`1px solid ${t.border}`,borderRadius:8,fontSize:12};
  const avgDeal=totalTx?totalCollected/totalTx:0;
  const momG=useMemo(()=>{if(monthlyTrend.length<2)return null;const l=monthlyTrend[monthlyTrend.length-1].amount;const p=monthlyTrend[monthlyTrend.length-2].amount;return p?pct(l-p,p):null;},[monthlyTrend]);
  const runT=useMemo(()=>{let c=0;return monthlyTrend.map(m=>({...m,cumulative:c+=m.amount}));},[monthlyTrend]);
  const byPdcP=useMemo(()=>{const m={};filtered.forEach(r=>{const k=r.Ptype||'Unknown';if(!m[k])m[k]={name:k,conv:0,total:0};m[k].total++;if(r.PDCStatus==='Converted')m[k].conv++;});return Object.values(m).filter(x=>x.total>=3).map(x=>({...x,rate:pct(x.conv,x.total)})).sort((a,b)=>b.rate-a.rate);},[filtered]);
  const byTeam=useMemo(()=>{const m={};filtered.forEach(r=>{const k=r.Team||'Unknown';m[k]=(m[k]||0)+r._amount;});return Object.entries(m).sort((a,b)=>b[1]-a[1]).map(([n,v])=>({name:n,value:v}));},[filtered]);

  const aiPrompt=useMemo(()=>{
    const topC=topCustomers.slice(0,3).map(c=>`${c.name}: AED ${fmt(c.value)}`).join(', ');
    const topE=leaderboard.execs.slice(0,3).map(e=>`${e.name}: AED ${fmt(e.amount)}`).join(', ');
    return `You are a senior sales analyst. Analyse this collections dashboard data and provide 5 concise, actionable bullet-point insights for management:\n- Total collected: AED ${fmt(totalCollected)} across ${totalTx} transactions\n- Unique customers: ${uniqueCustomers}\n- Top customers: ${topC}\n- Top executives: ${topE}\n- AMC/Retention: AED ${fmt((retVsNew.find(r=>r.name.includes('AMC'))||{}).value||0)}, New Business: AED ${fmt((retVsNew.find(r=>r.name.includes('New'))||{}).value||0)}\n- Concentration risk: top 3 = ${fmtP(concentration)}\nHighlight trends, risks, and recommendations.`;
  },[totalCollected,totalTx,uniqueCustomers,topCustomers,leaderboard,retVsNew,concentration]);

  return(<div>
    <div style={{display:'grid',gridTemplateColumns:'repeat(4,1fr)',gap:14,marginBottom:14}}>
      <KPI label="Total Collected" value={`AED ${fmt(totalCollected)}`} sub={`${fmt(totalTx)} transactions`} t={t}/>
      <KPI label="Unique Customers" value={fmt(uniqueCustomers)} sub="billed" t={t}/>
      <KPI label="Active Employees" value={fmt(uniqueEmployees)} t={t}/>
      <KPI label="Avg Deal Size" value={`AED ${fmt(avgDeal)}`} sub={momG!==null?`MoM: ${momG>=0?'+':''}${fmtP(momG)}`:undefined} t={t} ac={momG!==null?(momG>=0?t.success:t.danger):undefined}/>
    </div>
    {concentration>50&&<div style={{background:'#fee2e2',border:'1px solid #fca5a5',borderRadius:8,padding:'10px 16px',color:'#991b1b',fontSize:13,marginBottom:14}}>⚠️ Concentration risk: top 3 customers = <strong>{fmtP(concentration)}</strong> of total</div>}
    <ChartCard title="Monthly Collections Trend" chartId="monthly_trend" data={monthlyTrend} keys={[{key:'amount',name:'Collections',color:t.accent}]} nameKey="label" height={200} defaultType="area" t={t} style={{marginBottom:14}}/>
    <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:14,marginBottom:14}}>
      <ChartCard title="Cumulative Collections" chartId="cumulative" data={runT} keys={[{key:'cumulative',name:'Cumulative',color:'#10b981'}]} nameKey="label" height={180} defaultType="area" t={t}/>
      <ChartCard title="Retention vs New Business" chartId="retention_new" data={retVsNew.filter(d=>d.value>0)} keys={retVsNew.filter(d=>d.value>0).map((d,i)=>({key:'value',name:d.name,color:COLORS[i]}))} height={200} defaultType="donut" t={t}/>
    </div>
    <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:14,marginBottom:14}}>
      <ChartCard title="By Product Type" chartId="by_ptype" data={byPtype.slice(0,8)} keys={[{key:'value',name:'Amount',color:t.accent}]} height={220} defaultType="barH" t={t}/>
      <ChartCard title="By Region" chartId="by_region" data={byRegion} keys={[{key:'value',name:'Amount',color:t.accent}]} height={220} defaultType="bar" t={t}/>
    </div>
    <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:14,marginBottom:14}}>
      <Card title="Top 10 Customers" t={t}>{topCustomers.map((c,i)=>(<div key={i} style={{marginBottom:10}}><div style={{display:'flex',justifyContent:'space-between',fontSize:12,marginBottom:3}}><span style={{display:'flex',gap:8,overflow:'hidden'}}><span style={{fontSize:11,fontWeight:700,color:t.muted,width:22,flexShrink:0}}>#{i+1}</span><span style={{overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}}>{c.name}</span></span><span style={{fontSize:11,color:t.muted,flexShrink:0,marginLeft:8}}>AED {fmt(c.value)}</span></div><MiniBar value={c.value} max={maxC} color={COLORS[i%COLORS.length]} t={t}/></div>))}</Card>
      <Card title="Executive Leaderboard" t={t}>{leaderboard.execs.slice(0,10).map((e,i)=>(<div key={i} style={{marginBottom:10}}><div style={{display:'flex',justifyContent:'space-between',fontSize:12,marginBottom:3}}><span style={{display:'flex',gap:8}}><span style={{fontSize:11,fontWeight:700,color:t.muted,width:22}}>#{i+1}</span>{e.name}</span><span style={{fontSize:11,color:t.muted}}>AED {fmt(e.amount)}</span></div><MiniBar value={e.amount} max={maxE} color={COLORS[i%COLORS.length]} t={t}/></div>))}</Card>
    </div>
    <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:14}}>
      <Card title="PDC Conversion by Product" t={t}>{byPdcP.slice(0,8).map((p,i)=>(<div key={i} style={{marginBottom:10}}><div style={{display:'flex',justifyContent:'space-between',fontSize:12,marginBottom:3}}><span>{p.name}</span><span style={{color:p.rate>=70?t.success:p.rate>=50?t.warning:t.danger,fontFamily:"'DM Mono',monospace",fontSize:11}}>{fmtP(p.rate)} ({p.conv}/{p.total})</span></div><MiniBar value={p.rate} max={100} color={p.rate>=70?'#10b981':p.rate>=50?'#f59e0b':'#ef4444'} t={t}/></div>))}</Card>
      <ChartCard title="By Team" chartId="by_team" data={byTeam} keys={[{key:'value',name:'Amount',color:t.accent}]} height={220} defaultType="barH" t={t}/>
    </div>
    <AIInsights prompt={aiPrompt} t={t} label="AI Overview Insights"/>
  </div>);
}

/* ── Analysis Tab ── */
function AnalysisTab({filtered,yoyData,yoyYears,heatmapData,getHeatColor,slippage,t,dark}){
  const YCOL=['#3b82f6','#f43f5e','#f59e0b','#10b981','#8b5cf6'];
  const tt={background:t.card,border:`1px solid ${t.border}`,borderRadius:8,fontSize:12};
  const vel=useMemo(()=>{const m={};filtered.forEach(r=>{if(!m[r.Employee])m[r.Employee]={name:r.Employee,total:0,months:new Set()};m[r.Employee].total+=r._amount;m[r.Employee].months.add(`${r._year}-${r.Month}`);});return Object.values(m).map(e=>({name:e.name,vel:e.months.size?e.total/(e.months.size*22):0})).sort((a,b)=>b.vel-a.vel).slice(0,10);},[filtered]);
  const sSum=useMemo(()=>{const m={};slippage.forEach(s=>{if(!m[s.exec])m[s.exec]={name:s.exec,proj:0,act:0};m[s.exec].proj+=s.projected;m[s.exec].act+=s.actual;});return Object.values(m).map(e=>({...e,p:e.proj?pct(e.act,e.proj):0})).sort((a,b)=>a.p-b.p);},[slippage]);
  return(<div>
    <ChartCard title="Year-on-Year Comparison" chartId="yoy_comparison" data={yoyData} keys={yoyYears.map((y,i)=>({key:y,name:y,color:YCOL[i%YCOL.length]}))} nameKey="month" height={220} defaultType="line" t={t} style={{marginBottom:14}}/>
    <Card title="Seasonality Heatmap" t={t} style={{marginBottom:14}}><div style={{overflowX:'auto'}}><table style={{borderCollapse:'separate',borderSpacing:3}}><thead><tr><th style={{fontSize:11,color:t.muted,paddingRight:10,paddingBottom:6,textAlign:'left'}}>Year</th>{MONTHS.map(m=><th key={m} style={{fontSize:10,color:t.muted,fontWeight:500,textAlign:'center',minWidth:50,paddingBottom:6}}>{m}</th>)}</tr></thead><tbody>{heatmapData.map((row,i)=>(<tr key={i}><td style={{fontSize:12,fontWeight:600,color:t.text,paddingRight:10}}>{row.year}</td>{MONTHS.map(m=>{const v=row[m]||0;return(<td key={m} title={`AED ${fmt(v)}`}><div style={{background:getHeatColor(v),borderRadius:4,padding:'5px 3px',textAlign:'center',fontSize:9,fontFamily:"'DM Mono',monospace",color:v>0?(dark?'#e2e8f0':'#1e293b'):t.muted,minWidth:48}}>{v>0?`${(v/1000).toFixed(0)}K`:''}</div></td>);})}  </tr>))}</tbody></table></div></Card>
    <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:14}}>
      <Card title="Collection Velocity (AED/working day)" t={t}>{vel.map((e,i)=>(<div key={i} style={{marginBottom:10}}><div style={{display:'flex',justifyContent:'space-between',fontSize:12,marginBottom:3}}><span>{e.name}</span><span style={{fontSize:11,color:t.muted}}>AED {fmt(e.vel)}/day</span></div><MiniBar value={e.vel} max={(vel[0]&&vel[0].vel)||1} color={COLORS[i%COLORS.length]} t={t}/></div>))}</Card>
      <Card title="Slippage: Projection vs Actual" t={t}><div style={{overflowX:'auto'}}><table style={{width:'100%',borderCollapse:'collapse'}}><thead><tr>{['Executive','Projected','Actual','Attainment'].map(l=><TH key={l} t={t}>{l}</TH>)}</tr></thead><tbody>{sSum.slice(0,10).map((s,i)=>(<tr key={i}><TD t={t}>{s.name}</TD><TD t={t} mono>{fmt(s.proj)}</TD><TD t={t} mono>{fmt(s.act)}</TD><TD t={t}><Badge text={`${s.p.toFixed(0)}%`} type={s.p>=100?'green':s.p>=75?'amber':'red'}/></TD></tr>))}</tbody></table></div></Card>
    </div>
  </div>);
}


/* ── Reverse Calculator Tab ── */
function ReverseCalcTab({allTx,targets,sheets,t,dark}){
  const curYear=new Date().getFullYear();
  const availYears=useMemo(()=>[...new Set(allTx.map(r=>r._year).filter(Boolean))].sort((a,b)=>b-a),[allTx]);

  // Executives from Sheet4 (non-managers only)
  const executives=useMemo(()=>{
    const org=buildOrg(sheets.s4);
    return org.list.filter(p=>p.name&&(p.role||'').toLowerCase().includes('sales consultant')).sort((a,b)=>a.name.localeCompare(b.name));
  },[sheets.s4]);

  const[selExec,setSelExec]=useState('');
  const[selYear,setSelYear]=useState(curYear);
  const[avgDeal,setAvgDeal]=useState('');
  const[convRate,setConvRate]=useState('');
  const[daysToClose,setDaysToClose]=useState('');

  // Collected YTD for selected exec+year from Sheet2
  const collectedYTD=useMemo(()=>{
    if(!selExec)return 0;
    return allTx.filter(r=>String(r._year)===String(selYear)&&r.Employee&&r.Employee.trim()===selExec).reduce((s,r)=>s+r._amount,0);
  },[allTx,selExec,selYear]);

  // Annual target from targets store
  const annualTarget=useMemo(()=>parseFloat(targets[`target_${selExec}_${selYear}`]||0),[targets,selExec,selYear]);
  const remaining=Math.max(0,annualTarget-collectedYTD);

  // Working days left in year (rough: from today to Dec 31, minus weekends)
  const workingDaysLeft=useMemo(()=>{
    const today=new Date();
    const yearEnd=new Date(selYear,11,31);
    if(yearEnd<today)return 0;
    let count=0;const d=new Date(today);
    while(d<=yearEnd){const day=d.getDay();if(day!==0&&day!==6)count++;d.setDate(d.getDate()+1);}
    return count;
  },[selYear]);

  // Calc
  const calc=useMemo(()=>{
    const ad=parseFloat(avgDeal)||0;
    const cr=parseFloat(convRate)||0;
    const dtc=parseFloat(daysToClose)||0;
    if(!ad||!cr||!dtc)return null;
    const crFrac=cr/100;
    const totalLeads=remaining>0?Math.ceil(remaining/(ad*crFrac)):0;
    const effectiveDays=Math.max(1,workingDaysLeft-dtc);
    const leadsPerDay=remaining>0?totalLeads/effectiveDays:0;
    const dealsNeeded=remaining>0?Math.ceil(remaining/ad):0;
    const pipelineNeeded=remaining>0?dealsNeeded/crFrac:0;
    return{totalLeads,leadsPerDay,dealsNeeded,pipelineNeeded,effectiveDays,remaining,annualTarget,collectedYTD};
  },[avgDeal,convRate,daysToClose,remaining,workingDaysLeft,annualTarget,collectedYTD]);

  const inp={background:t.surface,border:`1px solid ${t.border}`,borderRadius:8,padding:'9px 12px',fontSize:14,color:t.text,fontFamily:"'DM Sans',sans-serif",width:'100%'};
  const lbl={fontSize:12,fontWeight:600,color:t.muted,marginBottom:6,display:'block'};

  const attPct=annualTarget?pct(collectedYTD,annualTarget):0;
  const statColor=attPct>=100?t.success:attPct>=75?t.warning:t.danger;

  return(<div style={{maxWidth:860,margin:'0 auto'}}>
    <div style={{marginBottom:20}}>
      <div style={{fontSize:18,fontWeight:700,color:t.text,marginBottom:4}}>Reverse Calculator</div>
      <div style={{fontSize:13,color:t.muted}}>Find out how many leads an executive needs per day to hit their remaining target.</div>
    </div>

    {/* Step 1: Select executive */}
    <Card title="Step 1 — Select Executive" t={t} style={{marginBottom:14}}>
      <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:16}}>
        <div>
          <label style={lbl}>Sales Executive</label>
          <select value={selExec} onChange={e=>setSelExec(e.target.value)} style={inp}>
            <option value="">— Select executive —</option>
            {executives.map(e=><option key={e.name} value={e.name}>{e.name}{e.teams&&e.teams[0]?' · '+e.teams[0]:''}</option>)}
          </select>
        </div>
        <div>
          <label style={lbl}>Year</label>
          <select value={selYear} onChange={e=>setSelYear(parseInt(e.target.value))} style={inp}>
            {(availYears.length?availYears:[curYear,curYear-1]).map(y=><option key={y} value={y}>{y}</option>)}
          </select>
        </div>
      </div>
      {selExec&&<div style={{display:'grid',gridTemplateColumns:'repeat(3,1fr)',gap:12,marginTop:16}}>
        <div style={{background:t.surface,borderRadius:8,padding:'12px 14px'}}>
          <div style={{fontSize:11,color:t.muted,marginBottom:4}}>Annual Target</div>
          <div style={{fontSize:18,fontWeight:700,fontFamily:"'DM Mono',monospace",color:t.text}}>{annualTarget>0?`AED ${fmt(annualTarget)}`:'Not set'}</div>
        </div>
        <div style={{background:t.surface,borderRadius:8,padding:'12px 14px'}}>
          <div style={{fontSize:11,color:t.muted,marginBottom:4}}>Collected YTD</div>
          <div style={{fontSize:18,fontWeight:700,fontFamily:"'DM Mono',monospace",color:t.success}}>AED {fmt(collectedYTD)}</div>
        </div>
        <div style={{background:t.surface,borderRadius:8,padding:'12px 14px'}}>
          <div style={{fontSize:11,color:t.muted,marginBottom:4}}>Remaining</div>
          <div style={{fontSize:18,fontWeight:700,fontFamily:"'DM Mono',monospace",color:remaining>0?t.danger:t.success}}>{remaining>0?`AED ${fmt(remaining)}`:'Target met ✓'}</div>
          {annualTarget>0&&<div style={{marginTop:6}}>
            <div style={{background:t.border,borderRadius:4,height:5}}><div style={{height:5,borderRadius:4,background:statColor,width:`${Math.min(100,attPct)}%`,transition:'width .3s'}}/></div>
            <div style={{fontSize:10,color:statColor,marginTop:3,fontWeight:600}}>{fmtP(attPct)} attained</div>
          </div>}
        </div>
      </div>}
    </Card>

    {/* Step 2: Inputs */}
    <Card title="Step 2 — Deal Assumptions" t={t} style={{marginBottom:14}}>
      <div style={{display:'grid',gridTemplateColumns:'repeat(3,1fr)',gap:16}}>
        <div>
          <label style={lbl}>Average Deal Size (AED)</label>
          <input type="number" min="0" value={avgDeal} onChange={e=>setAvgDeal(e.target.value)} placeholder="e.g. 15000" style={inp}/>
          <div style={{fontSize:11,color:t.muted,marginTop:4}}>Typical contract value per closed deal</div>
        </div>
        <div>
          <label style={lbl}>Lead-to-Deal Conversion Rate (%)</label>
          <input type="number" min="0" max="100" value={convRate} onChange={e=>setConvRate(e.target.value)} placeholder="e.g. 25" style={inp}/>
          <div style={{fontSize:11,color:t.muted,marginTop:4}}>% of leads that convert to a closed deal</div>
        </div>
        <div>
          <label style={lbl}>Average Days to Close</label>
          <input type="number" min="1" value={daysToClose} onChange={e=>setDaysToClose(e.target.value)} placeholder="e.g. 30" style={inp}/>
          <div style={{fontSize:11,color:t.muted,marginTop:4}}>Working days from first contact to payment</div>
        </div>
      </div>
      {workingDaysLeft>0&&<div style={{marginTop:14,padding:'8px 12px',background:t.surface,borderRadius:8,fontSize:12,color:t.muted}}>
        📅 <strong style={{color:t.text}}>{workingDaysLeft}</strong> working days remaining in {selYear}
        {parseFloat(daysToClose)>0&&<span> · <strong style={{color:t.text}}>{Math.max(0,workingDaysLeft-parseFloat(daysToClose))}</strong> effective days (after subtracting close cycle)</span>}
      </div>}
    </Card>

    {/* Step 3: Results */}
    {calc&&remaining>0&&<Card title="Step 3 — What You Need" t={t} style={{marginBottom:14}}>
      <div style={{display:'grid',gridTemplateColumns:'repeat(2,1fr)',gap:14,marginBottom:16}}>
        <div style={{background:t.accent+'18',border:`1px solid ${t.accent}44`,borderRadius:10,padding:'18px 20px'}}>
          <div style={{fontSize:12,color:t.muted,marginBottom:6,fontWeight:600,textTransform:'uppercase',letterSpacing:'.5px'}}>Total Leads Required</div>
          <div style={{fontSize:40,fontWeight:800,fontFamily:"'DM Mono',monospace",color:t.accent,lineHeight:1}}>{fmt(calc.totalLeads)}</div>
          <div style={{fontSize:12,color:t.muted,marginTop:8}}>to collect AED {fmt(calc.remaining)} at {convRate}% conversion × AED {fmt(parseFloat(avgDeal))} avg deal</div>
        </div>
        <div style={{background:'#10b981'+'18',border:`1px solid ${'#10b981'}44`,borderRadius:10,padding:'18px 20px'}}>
          <div style={{fontSize:12,color:t.muted,marginBottom:6,fontWeight:600,textTransform:'uppercase',letterSpacing:'.5px'}}>Leads Needed Per Day</div>
          <div style={{fontSize:40,fontWeight:800,fontFamily:"'DM Mono',monospace",color:'#10b981',lineHeight:1}}>{calc.leadsPerDay<10?calc.leadsPerDay.toFixed(1):Math.ceil(calc.leadsPerDay)}</div>
          <div style={{fontSize:12,color:t.muted,marginTop:8}}>across {calc.effectiveDays} effective working days remaining</div>
        </div>
      </div>
      <div style={{display:'grid',gridTemplateColumns:'repeat(2,1fr)',gap:12}}>
        <div style={{background:t.surface,borderRadius:8,padding:'12px 14px'}}>
          <div style={{fontSize:11,color:t.muted,marginBottom:4}}>Deals Needed to Close</div>
          <div style={{fontSize:22,fontWeight:700,fontFamily:"'DM Mono',monospace",color:t.text}}>{fmt(calc.dealsNeeded)}</div>
          <div style={{fontSize:11,color:t.muted,marginTop:2}}>at AED {fmt(parseFloat(avgDeal))} per deal</div>
        </div>
        <div style={{background:t.surface,borderRadius:8,padding:'12px 14px'}}>
          <div style={{fontSize:11,color:t.muted,marginBottom:4}}>Pipeline Size Required</div>
          <div style={{fontSize:22,fontWeight:700,fontFamily:"'DM Mono',monospace",color:t.text}}>{fmt(Math.ceil(calc.pipelineNeeded))}</div>
          <div style={{fontSize:11,color:t.muted,marginTop:2}}>total leads in pipeline to yield {calc.dealsNeeded} deals</div>
        </div>
      </div>
      <div style={{marginTop:14,background:t.surface,border:`1px solid ${t.accent}33`,borderRadius:8,padding:'12px 16px',fontSize:13,color:t.accent,lineHeight:1.6}}>
        💡 <strong>{selExec}</strong> needs to generate <strong>{calc.leadsPerDay<10?calc.leadsPerDay.toFixed(1):Math.ceil(calc.leadsPerDay)} new leads every working day</strong> for the next {calc.effectiveDays} days to close {fmt(calc.dealsNeeded)} deals and collect the remaining <strong>AED {fmt(calc.remaining)}</strong> of their {selYear} target.
      </div>
    </Card>}

    {calc&&remaining===0&&selExec&&<div style={{textAlign:'center',padding:40,background:t.success+'18',border:`1px solid ${t.success}44`,borderRadius:12}}>
      <div style={{fontSize:40,marginBottom:12}}>🎉</div>
      <div style={{fontSize:20,fontWeight:700,color:t.success,marginBottom:6}}>{selExec} has hit their target!</div>
      <div style={{fontSize:14,color:t.muted}}>AED {fmt(collectedYTD)} collected vs AED {fmt(annualTarget)} target</div>
    </div>}

    {!selExec&&<div style={{textAlign:'center',padding:60,color:t.muted,fontSize:13}}>
      <div style={{fontSize:40,marginBottom:12}}>🧮</div>
      Select an executive above to begin
    </div>}
  </div>);
}

/* ── Main App ── */
function App(){
  const[dark,setDark]=useState(()=>{try{return localStorage.getItem('ciq_dark')==='1';}catch(_e){return false;}});
  const[tab,setTab]=useState('overview');
  const[sheets,setSheets]=useState({s1:[],s2:[],s3:[],s4:[],s5:[]});
  const[sheetMeta,setSheetMeta]=useState({s1:null,s2:null,s3:null,s4:null,s5:null});
  const[targets,setTargets]=useState({});
  const[booting,setBooting]=useState(true);
  const[credit,setCredit]=useState(DEFAULT_CREDIT);
  const[locked,setLocked]=useState(false);
  const[hasPwd,setHasPwd]=useState(false);
  const[tabUnlocked,setTabUnlocked]=useState(false);
  const[unmapped,setUnmapped]=useState([]);

  const[filters,setFilters]=useState({pdcStatus:'Both',region:[],branch:[],team:[],employee:[],year:[],quarter:[],month:[],ptype:[],stream:[]});
  const t=dark?THEMES.dark:THEMES.light;

  useEffect(()=>{document.body.style.background=t.bg;document.body.style.color=t.text;},[t]);
  useEffect(()=>{try{localStorage.setItem('ciq_dark',dark?'1':'0');}catch(_e){};},[dark]);

  useEffect(()=>{
    async function boot(){
      try{
        const[s1,s2,s3,s4,s5,meta,tg,pwd,cred]=await Promise.all([dbGet('s1'),dbGet('s2'),dbGet('s3'),dbGet('s4'),dbGet('s5'),dbGet('sheetMeta'),dbGet('targets'),dbGet('pwd_hash'),dbGet('credit')]);
        const loaded={s1:s1||[],s2:s2||[],s3:s3||[],s4:s4||[],s5:s5||[]};
        setSheets(loaded);if(meta)setSheetMeta(meta);if(tg)setTargets(tg);
        compUnmapped(loaded);
        if(pwd){setHasPwd(true);}
      }catch(e){console.error(e);}
      setBooting(false);
    }
    boot();
  },[]);

  function compUnmapped(s){const s4n=new Set(s.s4.map(r=>r.Name&&r.Name.trim()).filter(Boolean));const txn=[...new Set([...s.s1,...s.s2].map(r=>r.Employee&&r.Employee.trim()).filter(Boolean))];setUnmapped(txn.filter(n=>n&&!s4n.has(n)));}

  const saveTargets=useCallback(async(tg)=>{setTargets(tg);try{await dbSet('targets',tg);}catch(e){}},[]);

  const onFileUpload=useCallback((k,file)=>{if(!file)return;const reader=new FileReader();reader.onload=async e=>{const data=parseCSV(e.target.result);const ts=new Date().toLocaleString();setSheets(prev=>{const u={...prev,[k]:data};compUnmapped(u);return u;});setSheetMeta(prev=>{const u={...prev,[k]:`${file.name} · ${ts}`};dbSet('sheetMeta',u).catch(()=>{});return u;});try{await dbSet(k,data);}catch(err){console.error(err);}};reader.readAsText(file);},[]);
  const onClearSheet=useCallback(async(k)=>{setSheets(prev=>{const u={...prev,[k]:[]};compUnmapped(u);return u;});setSheetMeta(prev=>{const u={...prev,[k]:null};dbSet('sheetMeta',u).catch(()=>{});return u;});try{await dbDel(k);}catch(_e){}},[]);

  const allTx=useMemo(()=>[...sheets.s1,...sheets.s2].map(r=>({...r,_amount:parseAmt(r.Collection),_year:parseYear(r.yy)})),[sheets]);
  const filtered=useMemo(()=>allTx.filter(r=>{
    if(filters.pdcStatus!=='Both'&&r.PDCStatus!==filters.pdcStatus)return false;
    if(filters.region.length&&!filters.region.includes(r.Region))return false;
    if(filters.branch.length&&!filters.branch.includes(r.Branch))return false;
    if(filters.team.length&&!filters.team.includes(r.Team))return false;
    if(filters.employee.length&&!filters.employee.includes(r.Employee))return false;
    if(filters.year.length&&!filters.year.includes(String(r._year)))return false;
    if(filters.quarter.length&&!filters.quarter.some(q=>Q_MONTHS[q]&&Q_MONTHS[q].includes(r.Month)))return false;
    if(filters.month.length&&!filters.month.includes(r.Month))return false;
    if(filters.ptype.length&&!filters.ptype.includes(r.Ptype))return false;
    if(filters.stream.length&&!filters.stream.includes(r.Stream))return false;
    return true;
  }),[allTx,filters]);

  const dims=useMemo(()=>({regions:[...new Set([...allTx.map(r=>r.Region),...sheets.s4.map(r=>r.Region)].filter(Boolean))].sort(),branches:[...new Set([...allTx.map(r=>r.Branch),...sheets.s4.map(r=>r.Branch)].filter(Boolean))].sort(),teams:[...new Set([...allTx.map(r=>r.Team),...sheets.s4.map(r=>r.Team)].filter(Boolean))].sort(),years:[...new Set(allTx.map(r=>String(r._year)).filter(v=>v&&v!=='null'))].sort(),months:MONTHS.filter(m=>allTx.some(r=>r.Month===m)),ptypes:[...new Set(allTx.map(r=>r.Ptype).filter(Boolean))].sort(),streams:[...new Set(allTx.map(r=>r.Stream).filter(Boolean))].sort()}),[allTx]);

  const toggleF=(k,v)=>setFilters(f=>({...f,[k]:f[k].includes(v)?f[k].filter(x=>x!==v):[...f[k],v]}));
  const clearF=()=>setFilters({pdcStatus:'Both',region:[],branch:[],team:[],employee:[],year:[],quarter:[],month:[],ptype:[],stream:[]});
  const aFC=Object.values(filters).reduce((s,v)=>s+(Array.isArray(v)?v.length:v!=='Both'?1:0),0);

  const totalCollected=useMemo(()=>filtered.reduce((s,r)=>s+r._amount,0),[filtered]);
  const totalTx=filtered.length;
  const uniqueCustomers=useMemo(()=>new Set(filtered.map(r=>r.Customer)).size,[filtered]);
  const uniqueEmployees=useMemo(()=>new Set(filtered.map(r=>r.Employee)).size,[filtered]);
  const monthlyTrend=useMemo(()=>{const m={};filtered.forEach(r=>{const k=`${r._year}-${r.Month}`;if(!m[k])m[k]={label:`${r.Month} ${r._year}`,amount:0,month:r.Month,year:r._year};m[k].amount+=r._amount;});return Object.values(m).sort((a,b)=>a.year!==b.year?a.year-b.year:MONTHS.indexOf(a.month)-MONTHS.indexOf(b.month));},[filtered]);
  const byPtype=useMemo(()=>{const m={};filtered.forEach(r=>{m[r.Ptype]=(m[r.Ptype]||0)+r._amount;});return Object.entries(m).sort((a,b)=>b[1]-a[1]).map(([n,v])=>({name:n,value:v}));},[filtered]);
  const byRegion=useMemo(()=>{const m={};filtered.forEach(r=>{m[r.Region]=(m[r.Region]||0)+r._amount;});return Object.entries(m).sort((a,b)=>b[1]-a[1]).map(([n,v])=>({name:n,value:v}));},[filtered]);
  const topCustomers=useMemo(()=>{const m={};filtered.forEach(r=>{m[r.Customer]=(m[r.Customer]||0)+r._amount;});return Object.entries(m).sort((a,b)=>b[1]-a[1]).slice(0,10).map(([n,v])=>({name:n,value:v}));},[filtered]);
  const leaderboard=useMemo(()=>{const org4=buildOrg(sheets.s4);const s4m={};org4.list.forEach(p=>{s4m[p.name]=p;});const em={},mm={};filtered.forEach(r=>{const emp=r.Employee&&r.Employee.trim();const s4=s4m[emp];if(!s4)return;if(isManager(s4.role||s4.Role)){if(!mm[emp])mm[emp]={name:emp,amount:0};mm[emp].amount+=r._amount;}else{if(!em[emp])em[emp]={name:emp,amount:0};em[emp].amount+=r._amount;}});return{execs:Object.values(em).sort((a,b)=>b.amount-a.amount),mgrs:Object.values(mm).sort((a,b)=>b.amount-a.amount)};},[filtered,sheets.s4]);
  const retVsNew=useMemo(()=>{let ret=0,nb=0,oth=0;filtered.forEach(r=>{if(r.Stream&&r.Stream.toLowerCase().includes('amc'))ret+=r._amount;else if(r.Stream&&r.Stream.toLowerCase().includes('new'))nb+=r._amount;else oth+=r._amount;});return [{name:'AMC / Retention',value:ret},{name:'New Business',value:nb},{name:'Other',value:oth}];},[filtered]);
  const concentration=useMemo(()=>{const t3=topCustomers.slice(0,3).reduce((s,c)=>s+c.value,0);return pct(t3,totalCollected);},[topCustomers,totalCollected]);
  const yoyYears=useMemo(()=>[...new Set(filtered.map(r=>String(r._year)).filter(v=>v&&v!=='null'))].sort(),[filtered]);
  const yoyData=useMemo(()=>MONTHS.map(m=>{const e={month:m};yoyYears.forEach(y=>{e[y]=filtered.filter(r=>r.Month===m&&String(r._year)===y).reduce((s,r)=>s+r._amount,0);});return e;}),[filtered,yoyYears]);
  const heatmapData=useMemo(()=>yoyYears.map(y=>{const row={year:y};MONTHS.forEach(m=>{row[m]=filtered.filter(r=>r.Month===m&&String(r._year)===y).reduce((s,r)=>s+r._amount,0);});return row;}),[filtered,yoyYears]);
  const maxHeat=useMemo(()=>Math.max(...[].concat.apply([],heatmapData.map(r=>MONTHS.map(m=>r[m]||0))),1),[heatmapData]);
  const getHeatColor=v=>{const ratio=v/maxHeat;if(ratio===0)return t.surface;if(ratio<0.25)return dark?'#1e3a5f':'#dbeafe';if(ratio<0.5)return dark?'#1e40af':'#93c5fd';if(ratio<0.75)return dark?'#2563eb':'#3b82f6';return dark?'#60a5fa':'#1d4ed8';};
  const pipeline=useMemo(()=>{let as=0,un=0;const bE={};sheets.s3.forEach(r=>{const a=parseAmt(r['Collection Amount']);const ex=r.Executive||'Unknown';if(!bE[ex])bE[ex]={name:ex,assured:0,unassured:0};if(HIGH_CONF.has(r['Collection Type'])){as+=a;bE[ex].assured+=a;}if(LOW_CONF.has(r['Collection Type'])){un+=a;bE[ex].unassured+=a;}});return{assured:as,unassured:un,byExec:Object.values(bE).sort((a,b)=>(b.assured+b.unassured)-(a.assured+a.unassured))};},[sheets.s3]);
  const slippage=useMemo(()=>{const act={};sheets.s2.forEach(r=>{const k=`${r.Employee}|${r.Month}`;act[k]=(act[k]||0)+parseAmt(r.Collection);});return sheets.s3.map(r=>({exec:r.Executive,month:r.Month,projected:parseAmt(r['Collection Amount']),actual:act[`${r.Executive}|${r.Month}`]||0})).filter(r=>r.projected>0);},[sheets.s2,sheets.s3]);

  const hasData=sheets.s1.length>0||sheets.s2.length>0;
  const TABS=[['overview','Overview'],['analysis','Analysis'],['performance','Performance'],['pipeline','Pipeline'],['commission','Commission'],['support','Renewals Planning'],['reverse','🧮 Reverse Calc'],['targets','Targets'],['settings','⚙ Settings'],['security','🔐 Security']];

  if(booting)return(<div style={{minHeight:'100vh',background:t.bg,display:'flex',alignItems:'center',justifyContent:'center',flexDirection:'column',gap:16}}><div className="spin" style={{fontSize:36,color:t.accent}}>⟳</div><div style={{color:t.muted,fontSize:14}}>Loading saved data...</div></div>);
  if(locked)return <PasswordGate t={t} onUnlock={()=>setLocked(false)}/>;

  return(<div style={{minHeight:'100vh',background:t.bg,color:t.text}}>
    <div style={{background:t.card,borderBottom:`1px solid ${t.border}`,padding:'0 20px',display:'flex',alignItems:'center',height:52,position:'sticky',top:0,zIndex:100}}>
      <div style={{display:'flex',alignItems:'center',gap:8,marginRight:20,whiteSpace:'nowrap',flexShrink:0}}>
        <svg width="28" height="28" viewBox="0 0 28 28" fill="none" xmlns="http://www.w3.org/2000/svg">
          <rect width="28" height="28" rx="7" fill={t.accent} opacity="0.15"/>
          <rect x="5" y="16" width="4" height="7" rx="1.5" fill={t.accent}/>
          <rect x="12" y="11" width="4" height="12" rx="1.5" fill={t.accent}/>
          <rect x="19" y="6" width="4" height="17" rx="1.5" fill={t.accent}/>
          <path d="M7 13 L14 9 L21 4" stroke={t.accent} strokeWidth="1.8" strokeLinecap="round" strokeLinejoin="round" opacity="0.6"/>
          <circle cx="21" cy="4" r="2" fill={t.accent}/>
        </svg>
        <span style={{fontSize:15,fontWeight:700,color:t.accent}}>Focus Dashboard</span>
      </div>
      <div style={{display:'flex',flex:1,overflowX:'auto'}}>
        {TABS.map(([k,l])=>(<button key={k} onClick={()=>setTab(k)} style={{background:'none',border:'none',cursor:'pointer',fontSize:13,fontWeight:600,color:tab===k?t.accent:t.muted,borderBottom:`2px solid ${tab===k?t.accent:'transparent'}`,padding:'0 12px',height:52,whiteSpace:'nowrap',fontFamily:"'DM Sans',sans-serif"}}>{l}</button>))}
      </div>
      <div style={{display:'flex',gap:8,alignItems:'center',marginLeft:'auto',flexShrink:0}}>
        {/* Credit label */}
        <div style={{textAlign:'right',marginRight:4}}>
          <div style={{fontSize:11,fontWeight:600,color:t.text,whiteSpace:'nowrap'}}>{credit.name}</div>
          <div style={{fontSize:10,color:t.muted,whiteSpace:'nowrap'}}>{credit.email}</div>
        </div>
        {aFC>0&&<span style={{fontSize:11,background:t.accent,color:'#fff',borderRadius:10,padding:'2px 7px',fontWeight:700}}>{aFC}</span>}
        <Btn t={t} onClick={()=>setDark(d=>!d)} style={{padding:'5px 10px',fontSize:12}}>{dark?'☀️':'🌙'}</Btn>
        {hasPwd&&<Btn t={t} onClick={()=>{setLocked(true);setTabUnlocked(false);}} style={{padding:'5px 10px',fontSize:12}}>🔒</Btn>}
      </div>
    </div>

    <div style={{padding:20,maxWidth:1600,margin:'0 auto'}}>
      {unmapped.length>0&&<div style={{background:'#fef3c7',border:'1px solid #fcd34d',borderRadius:8,padding:'10px 16px',color:'#92400e',fontSize:13,marginBottom:14}}>⚠️ <strong>Unmapped ({unmapped.length}):</strong> {unmapped.slice(0,5).join(', ')}{unmapped.length>5?` +${unmapped.length-5} more`:''}</div>}

      {tab==='settings'&&(hasPwd&&!tabUnlocked?<TabPasswordGate t={t} tabName="⚙ Settings" onUnlock={()=>setTabUnlocked(true)}/>:<SettingsTab sheets={sheets} sheetMeta={sheetMeta} onFileUpload={onFileUpload} onClearSheet={onClearSheet} t={t}/>)}
      {tab==='security'&&<SecurityTab t={t} onLock={()=>{setLocked(true);setTabUnlocked(false);}} credit={credit} onSaveCredit={async(c)=>{setCredit(c);await dbSet('credit',c);}}/>}
      {tab==='targets'&&(hasPwd&&!tabUnlocked?<TabPasswordGate t={t} tabName="Targets" onUnlock={()=>setTabUnlocked(true)}/>:<TargetsTab sheets={sheets} targets={targets} saveTargets={saveTargets} t={t}/>)}
      {tab==='commission'&&(hasPwd&&!tabUnlocked?<TabPasswordGate t={t} tabName="Commission" onUnlock={()=>setTabUnlocked(true)}/>:<CommissionTab sheets={sheets} targets={targets} t={t} dark={dark}/>)}
      {tab==='reverse'&&<ReverseCalcTab allTx={allTx} targets={targets} sheets={sheets} t={t} dark={dark}/>}
      {tab==='support'&&<SupportPlanningTab sheets={sheets} targets={targets} saveTargets={saveTargets} t={t}/>}
      {tab==='pipeline'&&<PipelineTab s3={sheets.s3} sheets={sheets} t={t} dark={dark}/>}
      {tab==='performance'&&<PerformanceTab allTx={allTx} targets={targets} sheets={sheets} t={t}/>}

      {(tab==='overview'||tab==='analysis')&&!hasData&&<div style={{textAlign:'center',padding:80,color:t.muted}}><div style={{fontSize:48,marginBottom:16}}>📊</div><div style={{fontSize:18,fontWeight:600,color:t.text,marginBottom:8}}>No data loaded</div><div style={{fontSize:14,marginBottom:20}}>Go to Settings to upload your CSV files.</div><Btn primary t={t} onClick={()=>setTab('settings')}>Go to Settings</Btn></div>}

      {(tab==='overview'||tab==='analysis')&&hasData&&<div style={{display:'flex',gap:16}}>
        <div style={{width:195,flexShrink:0}}>
          <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:8}}>
            <span style={{fontSize:11,fontWeight:700,color:t.muted,textTransform:'uppercase',letterSpacing:'.6px'}}>Filters</span>
